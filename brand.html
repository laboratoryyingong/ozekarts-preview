  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px\">\n\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px\">\n<div><p class=\"h\">Oz Ekarts · website redesign</p><h1 class=\"disp\" style=\"font-size: clamp(34px, 5.7vw, 80px)\">Style A<br>design system</h1></div>\n<p style=\"margin: 0; max-width: 480px; font-size: 15px; line-height: 1.6; color: #C9C9C5\">The Style A template (black + white, angled buttons, big italic display, neon accents) carrying Oz Ekarts' own logo, fonts, photography and copy. Every page on this canvas is built from this sheet.</p>\n</div>\n\n<section class=\"card\">\n<p class=\"h\">01 — Logo (from ozekarts.com.au)</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px\">\n<div style=\"background: #0B0B0C; border: 1px solid #26262A; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px\"><img decoding=\"async\" fetchpriority=\"high\" src=\"assets/logo/oze-logo-white.webp\" alt=\"Oz Ekarts logo, white\" style=\"width: 150px; height: 150px; object-fit: contain\"><span class=\"lbl\">Primary · white on black</span></div>\n<div style=\"background: #5CE1E6; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px\"><img decoding=\"async\" loading=\"lazy\" src=\"assets/logo/oze-logo-black.webp\" alt=\"Oz Ekarts logo, black\" style=\"width: 150px; height: 150px; object-fit: contain; mix-blend-mode: multiply\"><span class=\"lbl\" style=\"color: #0B0B0C\">Black on white (CTA band)</span></div>\n<div style=\"background: #F3F2EC; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px\"><img decoding=\"async\" loading=\"lazy\" src=\"assets/logo/oze-logo-black.webp\" alt=\"\" aria-hidden=\"true\" style=\"width: 150px; height: 150px; object-fit: contain; mix-blend-mode: multiply\"><span class=\"lbl\" style=\"color: #555\">Black on off-white (price sections)</span></div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; justify-content: center; font-size: 14px; line-height: 1.6; color: #C9C9C5\">\n<p style=\"margin: 0\"><b style=\"color: #fff\">Header lockup</b> 56 px mark + \"OZ <span style=\"color: #5CE1E6\">EKARTS</span> ADELAIDE\" in Aldrich Bold Italic.</p>\n<p style=\"margin: 0\"><b style=\"color: #fff\">Minimum size</b> 28 px (footer legal line).</p>\n<p style=\"margin: 0\"><b style=\"color: #fff\">Files</b> design/brand-assets/logo — white PNG 1024, black JPG 270. Ask client for the vector.</p>\n</div>\n</div>\n</section>\n\n<section class=\"card\">\n<p class=\"h\">02 — Colour · black &amp; white UI, neon accents</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px\">\n<div class=\"sw\" style=\"background: #0B0B0C; border: 1px solid #26262A\"><span>Black</span><span style=\"color: #A1A1A6\">#0B0B0C · ground</span></div>\n<div class=\"sw\" style=\"background: #F4F4F2; color: #0B0B0C\"><span>White</span><span style=\"color: #555\">#F4F4F2 · text, primary buttons, CTA band</span></div>\n<div class=\"sw\" style=\"background: #F3F2EC; color: #0B0B0C\"><span>Off-white</span><span style=\"color: #555\">#F3F2EC · price &amp; FAQ sections</span></div>\n<div class=\"sw\" style=\"background: #151517; border: 1px solid #26262A\"><span>Surface</span><span style=\"color: #A1A1A6\">#151517 · cards · line #26262A</span></div>\n<div class=\"sw\" style=\"background: #5CE1E6; color: #0B0B0C\"><span>Neon cyan</span><span style=\"color: rgba(0,0,0,.65)\">#5CE1E6 · headline highlight, stats, links</span></div>\n<div class=\"sw\" style=\"background: #8C52FF; color: #fff\"><span>Neon purple</span><span style=\"color: rgba(255,255,255,.8)\">#8C52FF · strips, form outlines</span></div>\n<div class=\"sw\" style=\"background: #FF00A1; color: #fff\"><span>Neon pink</span><span style=\"color: rgba(255,255,255,.8)\">#FF00A1 · hero tag, alerts, \"Closed\"</span></div>\n<div class=\"sw\" style=\"background: #D2A10D; color: #0B0B0C\"><span>Gold</span><span style=\"color: rgba(0,0,0,.65)\">#D2A10D · eyebrows, active nav</span></div>\n</div>\n<p style=\"margin: 16px 0 0; font-size: 13px; line-height: 1.6; color: #A1A1A6\">The UI itself is monochrome: white buttons on black, black buttons on off-white, white \"Are you ready?\" band. Neon is an accent — one highlight word in a headline, stat numbers, links, a strip or outline — never a fill behind body text. Contrast: cyan on black 13.6:1, gold on black 7.9:1, pink on black 4.6:1 (large text only), body #C9C9C5 on black 12:1.</p>\n</section>\n\n<section class=\"card\">\n<p class=\"h\">03 — Typography (Oz Ekarts fonts)</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px\">\n<div>\n<p class=\"lbl\" style=\"margin: 0 0 10px\">Display · Dameron (self-hosted on the live site)</p>\n<p class=\"disp\" style=\"font-size: clamp(30px, 5.1vw, 72px)\">Full throttle.</p>\n<p class=\"disp\" style=\"font-size: clamp(30px, 5.1vw, 72px); color: #5CE1E6; margin-bottom: 16px\">Full drift.</p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.6; color: #A1A1A6\">Always italic, uppercase, line-height 0.95. H1 104–128 px · H2 76–80 px · H3 34–44 px · stats 44–52 px · prices 60–64 px (upright).</p>\n</div>\n<div>\n<p class=\"lbl\" style=\"margin: 0 0 10px\">UI + body · Aldrich (Google Fonts)</p>\n<p style=\"margin: 0 0 8px; font: 700 italic 24px/1.1 Aldrich, sans-serif; text-transform: uppercase\">OZ <span style=\"color: #5CE1E6\">EKARTS</span> Adelaide</p>\n<p style=\"margin: 0 0 8px; font: 700 14px/1.4 Aldrich, sans-serif; letter-spacing: .02em; text-transform: uppercase\">Home &nbsp; Events &nbsp; Specials &nbsp; Racing &nbsp; <span style=\"color: #5CE1E6\">Drifting</span> &nbsp; Our Vision &nbsp; Contact Us</p>\n<p style=\"margin: 0 0 8px; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #5CE1E6\">01 — Eyebrow label</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #C9C9C5\">Body 16 px / 1.6. Unlike traditional karting where grip and lap times matter most, drift karting is all about control, style, and adrenaline.</p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.6; color: #A1A1A6\">Buttons 13 px bold, .1 em tracking. Labels 11–12 px bold, .12–.14 em. Both fonts in design/brand-assets/fonts.</p>\n</div>\n</div>\n</section>\n\n<section class=\"card\">\n<p class=\"h\">04 — Buttons &amp; components</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 24px\">\n<a class=\"btn\" href=\"#\" style=\"background: #F4F4F2; color: #0B0B0C\">Primary · book</a>\n<a class=\"btn\" href=\"#\" style=\"background: #F4F4F2; color: #0B0B0C\">Secondary</a>\n<a class=\"btn\" href=\"#\" style=\"background: #0B0B0C; color: #F4F4F2\">On light sections</a>\n<a class=\"btn\" href=\"#\" style=\"background: transparent; color: #F4F4F2; border: 1px solid #F4F4F2; clip-path: none\">Outline</a>\n<span style=\"background: #FF00A1; color: #fff; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px\">Hero claim tag</span>\n<span style=\"background: #F4F4F2; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Most popular</span>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<div style=\"background: #0B0B0C; border: 1px solid #26262A\"><img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/adult-kart.webp\" srcset=\"assets/photos/adult-kart-480.webp 480w, assets/photos/adult-kart-960.webp 960w, assets/photos/adult-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"\" aria-hidden=\"true\" style=\"width: 100%; height: 140px; object-fit: cover; display: block\"><div style=\"padding: 20px\"><p class=\"h\" style=\"margin-bottom: 8px\">Adult · ages 12+</p><p class=\"disp\" style=\"font-size: 34px; margin-bottom: 4px\">Adult kart</p><p style=\"margin: 0; font-size: 13px; color: #C9C9C5\">Price card: photo · eyebrow · Dameron title · price · angled button</p></div></div>\n<div style=\"background: #111113; border-top: 4px solid #8C52FF; padding: 20px\"><p class=\"lbl\" style=\"margin: 0 0 10px\">Stat strip tile</p><p class=\"disp\" style=\"font-size: clamp(28px, 3.4vw, 48px); color: #5CE1E6; margin-bottom: 6px\">188m</p><p style=\"margin: 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6\">Indoor track · 10 turns</p></div>\n<div style=\"background: #0B0B0C; border: 1px solid #26262A; padding: 20px; display: flex; flex-direction: column; gap: 10px\"><p class=\"lbl\" style=\"margin: 0\">Spec row + divider</p><div style=\"display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #26262A; font-size: 14px\"><span style=\"color: #A1A1A6\">Power</span><b>100% electric</b></div><div aria-hidden=\"true\" style=\"height: 10px; background: repeating-conic-gradient(#F4F4F2 0 25%, #0B0B0C 0 50%) 0 0 / 10px 10px\"></div><p style=\"margin: 0; font-size: 12px; color: #A1A1A6\">Chequered divider frames the white CTA band</p></div>\n</div>\n</section>\n\n<section class=\"card\">\n<p class=\"h\">05 — Photography &amp; video (from ozekarts.com.au · 16 photos + hero video in design/brand-assets)</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/header-IMG_2111.webp\" srcset=\"assets/photos/header-IMG_2111-480.webp 480w, assets/photos/header-IMG_2111-960.webp 960w, assets/photos/header-IMG_2111.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Neon-lit track with mural\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/drifting-IMG_3999.webp\" srcset=\"assets/photos/drifting-IMG_3999-480.webp 480w, assets/photos/drifting-IMG_3999-960.webp 960w, assets/photos/drifting-IMG_3999.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kart drifting\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/racing-IMG_3876.webp\" srcset=\"assets/photos/racing-IMG_3876-480.webp 480w, assets/photos/racing-IMG_3876-960.webp 960w, assets/photos/racing-IMG_3876.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Karts side by side\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/junior-kart.webp\" srcset=\"assets/photos/junior-kart-480.webp 480w, assets/photos/junior-kart-960.webp 960w, assets/photos/junior-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Junior driver\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_0878.webp\" srcset=\"assets/photos/events-IMG_0878-480.webp 480w, assets/photos/events-IMG_0878-960.webp 960w, assets/photos/events-IMG_0878.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kids birthday group\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_20861.webp\" srcset=\"assets/photos/events-IMG_20861-480.webp 480w, assets/photos/events-IMG_20861-960.webp 960w, assets/photos/events-IMG_20861.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Overhead track\" style=\"width: 100%; aspect-ratio: 3/2; object-fit: cover\">\n</div>\n<p style=\"margin: 16px 0 0; font-size: 13px; line-height: 1.6; color: #A1A1A6\">Neon light trails on black are the brand's own look; the UI stays black and white with the same neons as accents. Text sits on a 45–100% black gradient. Hero: existing \"SA 1st electric go karting\" mp4 (10 MB) with a left-to-right dark gradient.</p>\n</section>\n\n</div>\n</div>",
  css: "body{margin:0;background:#0B0B0C}\nimg{max-width:100%}\n@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.lbl{font:700 11px/1.4 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A1A1A6}\n.h{margin:0 0 20px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D2A10D}\n.sw{padding:16px;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font:700 13px/1.3 Aldrich,sans-serif}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\n.card{background:#151517;border:1px solid #26262A;padding:28px}",
