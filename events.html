body{margin:0;background:#0B0B0C}
img{max-width:100%}
@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}
a{color:#39FF14}a:hover{color:#FFFFFF}
section[style*="#F3F2EC"] a:not(.btn):not(.pill),section[style*="#F3F2EC"] a:not(.btn):not(.pill):hover{color:#0B0B0C}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}
.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D2A10D}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.body{font-size:16px;line-height:1.6;color:#C9C9C5}
.card{background:#151517;border:1px solid #26262A}
.pk{padding:26px;display:flex;flex-direction:column;gap:12px}
.btn.ghost{position:relative;z-index:0;background:#F4F4F2;color:#F4F4F2}.btn.ghost::before{content:"";position:absolute;inset:1px;z-index:-1;background:#151517;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}.btn.ghost:hover{color:#0B0B0C}.btn.ghost:hover::before{background:#F4F4F2}
.pk ul{margin:0;padding-left:18px;font-size:14px;line-height:1.8}
.fld{background:#151517;color:#F4F4F2;border:1px solid #333338;min-height:46px;padding:0 12px;font:400 14px Aldrich,sans-serif;width:100%;box-sizing:border-box}
.lab{display:flex;flex-direction:column;gap:6px;font:700 12px/1.3 Aldrich,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.spec{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #26262A;font-size:14px}
/* Client logo marquee: always one row. Logo width scales with the viewport so 4 (phone) to about 7 (desktop) are visible at once. */
.marq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq-track{display:flex;flex-wrap:nowrap;width:max-content;animation:marq 80s linear infinite}
.marq:hover .marq-track,.marq:focus-within .marq-track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
/* Reduced motion: keep the single row, just scroll much slower (still pauses on hover). */
@media (prefers-reduced-motion:reduce){.marq-track{animation-duration:200s}}
.logo{background:#F3F2EC;border:1px solid #26262A;width:clamp(78px,12vw,150px);height:clamp(56px,6.4vw,88px);flex:none;margin-right:clamp(8px,1vw,12px);display:flex;align-items:center;justify-content:center;padding:clamp(8px,1vw,12px);box-sizing:border-box}
.logo img{max-width:82%;max-height:70%;object-fit:contain;filter:grayscale(1);mix-blend-mode:multiply;opacity:.85;transition:filter .2s,opacity .2s}.logo:hover img{filter:none;opacity:1}
.oze-err{margin-top:6px;font:700 12px/1.4 Aldrich,sans-serif;letter-spacing:.04em;color:#FF6B6B}
.is-invalid .fld,.is-invalid .fldw{border-color:#FF6B6B!important}
.oze-status{margin-top:4px;font-size:14px;line-height:1.5}.oze-status.error{color:#FF6B6B}.oze-status[hidden]{display:none}
.oze-done{padding:8px 0}.oze-done-title{margin:0 0 8px;font:italic 400 40px/1 Dameron,Aldrich,sans-serif;text-transform:uppercase;color:#5CE1E6}
[data-field]{display:flex;flex-direction:column}.span2{grid-column:1 / -1}
[hidden]{display:none!important}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;text-transform:none!important;font-size:14px!important;letter-spacing:0!important}
@media (max-width:860px){.enq{grid-template-columns:1fr!important}}
.q{-webkit-text-stroke:.5px currentColor}
.silver{background:linear-gradient(110deg,#8D9096 0%,#E9EBEE 28%,#FFFFFF 40%,#A7ABB1 55%,#F2F3F5 72%,#8D9096 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.silver{animation:none}}

<script>
DC.define("Events", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C\">\n\n<dc-import name=\"Header\" active=\"events\"></dc-import>\n\n<section class=\"wrap\" style=\"padding-top: clamp(40px, 5vw, 72px); padding-bottom: clamp(40px, 5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; align-items: center\">\n<div>\n<span style=\"display: inline-block; background: #8C52FF; color: #fff; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px; margin-bottom: 22px\">Birthday parties · corporate events · venue hire</span>\n<h1 class=\"disp\" style=\"font-size: clamp(26px, 3.2vw, 46px)\">Exclusive<br>drift karting<br><span style=\"color: #FF00A1; white-space: nowrap\">for any occasion</span></h1>\n<p class=\"body\" style=\"max-width: 560px; margin: 20px 0 28px; color: #F4F4F2\">Birthdays, corporate functions, team building. Private party room, viewing deck, BYO food welcome.</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a class=\"btn\" href=\"#enquiry\" style=\"background: #F4F4F2; color: #0B0B0C\">Make an enquiry</a>\n<a class=\"btn\" href=\"#packages\" style=\"background: transparent; color: #F4F4F2; border: 1px solid #F4F4F2; clip-path: none\">See packages</a>\n</div>\n</div>\n<div style=\"display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: 200px 200px; gap: 10px\">\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/photos/events-IMG_0878.webp\" srcset=\"assets/photos/events-IMG_0878-480.webp 480w, assets/photos/events-IMG_0878-960.webp 960w, assets/photos/events-IMG_0878.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kids birthday group in front of the chequered wall\" style=\"width: 100%; height: 100%; object-fit: cover; display: block; grid-row: span 2\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5421.webp\" srcset=\"assets/photos/events-IMG_5421-480.webp 480w, assets/photos/events-IMG_5421-960.webp 960w, assets/photos/events-IMG_5421.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Corporate group with helmets\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5684.webp\" srcset=\"assets/photos/events-IMG_5684-480.webp 480w, assets/photos/events-IMG_5684-960.webp 960w, assets/photos/events-IMG_5684.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Party group in costume\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\">\n</div>\n</section>\n<div aria-hidden=\"true\" style=\"height: 12px; background: repeating-conic-gradient(#F4F4F2 0 25%, #0B0B0C 0 50%) 0 0 / 12px 12px\"></div>\n\n<!-- 01 Junior party packages (off-white) -->\n<section id=\"packages\" style=\"background: #F3F2EC; color: #0B0B0C\">\n<div class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px\">\n<div><p class=\"eyebrow\" style=\"color: #6D32D9\">01 — Junior party packages</p><h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px)\">Birthday parties</h2></div>\n<p style=\"max-width: 400px; font-size: 15px; line-height: 1.55; color: #3A3A3A; margin: 0\">Every package includes the private party room and certificates.</p>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<article class=\"pk\" style=\"background: #fff; border: 2px solid #0B0B0C\">\n<p class=\"eyebrow\" style=\"margin: 0; color: #0B0B0C\">Bronze</p>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.3vw, 60px)/1.02 Aldrich, sans-serif\">$480</span><span style=\"font-size: 14px; color: #3A3A3A\">From 6 drivers</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Additional guests $70 each</p>\n<ul style=\"color: #2A2A2A\"><li>7-minute track session</li><li>15-minute track session</li><li>1 off-track game</li><li>Party room + certificates</li></ul>\n<a class=\"btn\" href=\"#enquiry\" style=\"background: #0B0B0C; color: #F4F4F2; margin-top: auto\">Enquire</a>\n</article>\n<article class=\"pk\" style=\"background: #0B0B0C; color: #F4F4F2; border: 2px solid #0B0B0C; position: relative\">\n<span style=\"position: absolute; top: -14px; right: 18px; background: #F4F4F2; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Popular</span>\n<p class=\"eyebrow silver\" style=\"margin: 0\">Silver</p>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span class=\"silver\" style=\"font: 700 clamp(28px, 4.3vw, 60px)/1.02 Aldrich, sans-serif\">$686</span><span style=\"font-size: 14px; color: #C9C9C5\">From 7 drivers</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Additional guests $85 each</p>\n<ul style=\"color: #C9C9C5\"><li>10-minute track game</li><li>15-minute track session</li><li>2 off-track games</li><li>Medals for winners · party room + certificates</li></ul>\n<a class=\"btn\" href=\"#enquiry\" style=\"background: #F4F4F2; color: #0B0B0C; margin-top: auto\">Enquire</a>\n</article>\n<article class=\"pk\" style=\"background: #fff; border: 2px solid #0B0B0C\">\n<p class=\"eyebrow\" style=\"margin: 0; color: #0B0B0C\">Gold</p>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.3vw, 60px)/1.02 Aldrich, sans-serif\">$840</span><span style=\"font-size: 14px; color: #3A3A3A\">From 7 drivers</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Additional guests $100 each</p>\n<ul style=\"color: #2A2A2A\"><li>7-minute track session</li><li>10-minute track game</li><li>15-minute track session</li><li>3 off-track games</li><li>Medals for winners · party room + certificates</li></ul>\n<a class=\"btn\" href=\"#enquiry\" style=\"background: #0B0B0C; color: #F4F4F2; margin-top: auto\">Enquire</a>\n</article>\n</div>\n<div id=\"party-faq\" style=\"margin-top: 20px; background: #fff; border: 2px solid #0B0B0C; padding: 22px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px\"><b style=\"font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6D32D9\">Party questions</b><a href=\"faq.html#parties\" style=\"font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #0B0B0C\">All party FAQs →</a></div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 24px; font-size: 14px; line-height: 1.55; color: #2A2A2A\">\n<div><b class=\"q\" style=\"display: block; color: #0B0B0C; margin-bottom: 4px\">What is the on-track game?</b>Musical Karts: similar to musical chairs, a 10-minute game in the karts run by our marshals. When the music stops, drivers must too!</div>\n<div><b class=\"q\" style=\"display: block; color: #0B0B0C; margin-bottom: 4px\">What are the off-track games?</b>Choose between Jenga, Connect Four and Ring Toss to occupy drivers in between races! Bronze offers one, Silver offers two and Gold offers all three.</div>\n<div><b class=\"q\" style=\"display: block; color: #0B0B0C; margin-bottom: 4px\">Can we bring food and cake?</b>Yes! In the party room you will have access to a fridge, cups, plates and cutlery for any food and drinks you bring. We also offer a small selection of drinks and snacks for purchase!</div>\n<div><b class=\"q\" style=\"display: block; color: #0B0B0C; margin-bottom: 4px\">Who can drive?</b>Junior karts suit ages 6–11 (recommended 6–9), with a minimum height of 100 cm. Younger or smaller guests can watch from the viewing deck!</div>\n</div>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_0878.webp\" srcset=\"assets/photos/events-IMG_0878-480.webp 480w, assets/photos/events-IMG_0878-960.webp 960w, assets/photos/events-IMG_0878.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kids birthday group in front of the chequered wall\" style=\"width: 100%; height: 220px; object-fit: cover; display: block\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/kids-karting.webp\" srcset=\"assets/photos/kids-karting-480.webp 480w, assets/photos/kids-karting-960.webp 960w, assets/photos/kids-karting.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Junior racers on the podium\" style=\"width: 100%; height: 220px; object-fit: cover; display: block\">\n<a href=\"https://ozekarts.com.au/wp-content/uploads/2025/12/2026-birthday-invitation-temp.jpg\" style=\"display: flex; align-items: center; gap: 16px; padding: 18px; background: #fff; border: 2px solid #0B0B0C; text-decoration: none; color: #0B0B0C\"><img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/birthday-invitation.webp\" srcset=\"assets/photos/birthday-invitation-480.webp 480w, assets/photos/birthday-invitation-960.webp 960w, assets/photos/birthday-invitation.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"\" aria-hidden=\"true\" style=\"width: 110px; height: 150px; object-fit: cover\"><span><b style=\"display: block; font-size: 15px; margin-bottom: 6px; text-transform: uppercase\">2026 birthday invitation</b><span style=\"font-size: 13px; color: #3A3A3A\">Print-ready invite for your guests. Download →</span></span></a>\n</div>\n</div>\n</section>\n\n<!-- 02 Racing packages -->\n<section id=\"racing\" class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px\">\n<div><p class=\"eyebrow\">02 — Go kart racing · minimum age 12</p><h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px)\">Corporate, team building,<br>bucks &amp; hens</h2></div>\n<div style=\"max-width: 400px\"><p class=\"body\" style=\"margin: 0 0 10px; font-size: 15px\">Exclusive track access for your group. Up to 9 drivers per race, larger groups rotate sessions on track.</p>\n<p class=\"body\" style=\"margin: 0 0 14px; font-size: 15px\">Add on our private party room for a cleaning fee of $50.</p>\n<a href=\"#enquiry\" style=\"font: 700 14px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #39FF14; text-decoration: underline; text-underline-offset: 4px\">Enquire now →</a></div>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<article class=\"card pk\">\n<p class=\"eyebrow\" style=\"margin: 0\">Grand Prix</p>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.3vw, 60px)/1.02 Aldrich, sans-serif; color: #5CE1E6\">$630</span><span style=\"font-size: 14px; color: #C9C9C5\">From 6 people</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Additional drivers $105 each<br>8+ drivers $100 each</p>\n<ul style=\"color: #C9C9C5\"><li>10-minute practice</li><li>10-minute qualifying</li><li>20 lap race</li><li>Live leaderboard</li><li>Glass trophy for 1st place</li></ul>\n<a class=\"btn ghost\" href=\"https://bookings.racefacer.com/ozekarts/package/adults-karts\" style=\"margin-top: auto\">Book Grand Prix</a>\n</article>\n<article class=\"card pk\">\n<p class=\"eyebrow\" style=\"margin: 0\">Rapid Racing</p>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.3vw, 60px)/1.02 Aldrich, sans-serif; color: #A970FF\">$420</span><span style=\"font-size: 14px; color: #C9C9C5\">From 6 people</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Additional drivers $70 each</p>\n<ul style=\"color: #C9C9C5\"><li>10-minute qualifying</li><li>15 lap race</li><li>Live leaderboard</li></ul>\n<a class=\"btn ghost\" href=\"https://bookings.racefacer.com/ozekarts/rapid-racing\" style=\"margin-top: auto\">Book Rapid Racing</a>\n</article>\n<article class=\"card\" style=\"position: relative; min-height: 400px; overflow: hidden\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5421.webp\" srcset=\"assets/photos/events-IMG_5421-480.webp 480w, assets/photos/events-IMG_5421-960.webp 960w, assets/photos/events-IMG_5421.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Corporate group with helmets outside the venue\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n<div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,12,0) 20%, rgba(11,11,12,.95) 100%)\"></div>\n<div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 26px; text-align: center\"><p class=\"disp\" style=\"font-size: clamp(24px, 2.1vw, 30px); margin-bottom: 8px\">Kick-start your<br>celebrations</p><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Come celebrate with friends in action-packed drifting! 0.00% BAC policy applies.</p></div>\n</article>\n</div>\n</section>\n\n<!-- 03 Venue hire (restored at the client's request, round 4) -->\n<section id=\"venue-hire\" style=\"background: #111113; border-top: 1px solid #222226; border-bottom: 1px solid #222226\">\n<div class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: center\">\n<div>\n<p class=\"eyebrow\">03 — Private track hire &amp; custom events</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 20px\">Exclusive<br>venue hire</h2>\n<p class=\"body\" style=\"margin: 0 0 24px\">The track to yourselves, with party room and viewing deck. Add drinks, pizzas and catering. Tailored to your group, fully supervised.</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div class=\"card\" style=\"padding: 18px\"><p style=\"margin: 0 0 4px; font: 700 34px/1.02 Aldrich, sans-serif; color: #5CE1E6\">3 hrs+</p><p style=\"margin: 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #A1A1A6\">Off-peak hire</p></div>\n<div class=\"card\" style=\"padding: 18px\"><p style=\"margin: 0 0 4px; font: 700 34px/1.02 Aldrich, sans-serif; color: #5CE1E6\">4 hrs+</p><p style=\"margin: 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #A1A1A6\">Peak hire</p></div>\n<div class=\"card\" style=\"padding: 18px\"><p style=\"margin: 0 0 4px; font: 700 34px/1.02 Aldrich, sans-serif; color: #5CE1E6\">4 / hr</p><p style=\"margin: 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #A1A1A6\">Sessions · adults only</p></div>\n<div class=\"card\" style=\"padding: 18px\"><p style=\"margin: 0 0 4px; font: 700 34px/1.02 Aldrich, sans-serif; color: #5CE1E6\">5 / hr</p><p style=\"margin: 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #A1A1A6\">Sessions · juniors or mixed</p></div>\n</div>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5745.webp\" srcset=\"assets/photos/events-IMG_5745-480.webp 480w, assets/photos/events-IMG_5745-960.webp 960w, assets/photos/events-IMG_5745.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Private party room\" style=\"width: 100%; height: 240px; object-fit: cover; grid-column: 1 / -1; display: block\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5684.webp\" srcset=\"assets/photos/events-IMG_5684-480.webp 480w, assets/photos/events-IMG_5684-960.webp 960w, assets/photos/events-IMG_5684.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Birthday party group in costume\" style=\"width: 100%; height: 190px; object-fit: cover; display: block\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_20861.webp\" srcset=\"assets/photos/events-IMG_20861-480.webp 480w, assets/photos/events-IMG_20861-960.webp 960w, assets/photos/events-IMG_20861.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Overhead view of the indoor track\" style=\"width: 100%; height: 190px; object-fit: cover; display: block\">\n</div>\n</div>\n</section>\n\n<section class=\"wrap\" style=\"padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<dc-import name=\"Estimator\" start=\"{{ten}}\"></dc-import>\n</section>\n\n<!-- 04 Enquiry form -->\n<section id=\"enquiry\" class=\"wrap enq\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px); display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 2.2fr); gap: 48px; align-items: start\">\n<div>\n<p class=\"eyebrow\">04 — Event enquiry form</p>\n<h2 class=\"disp\" style=\"font-size: clamp(28px, 3vw, 44px); margin-bottom: 16px\">Tell us about<br>your event</h2>\n<p class=\"body\" style=\"margin: 0 0 20px\">Final price confirmed by email within 1-3 business days.</p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.9; font-weight: 700; color: #F4F4F2\">Private party room included in all Junior Packages.</p>\n</div>\n<form data-gf=\"7\" style=\"background: #0B0B0C; border: 2px solid #8C52FF; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 20px\">\n<label class=\"lab\" data-field=\"86\">Name<input class=\"fld\" type=\"text\" name=\"input_86\" autocomplete=\"name\" placeholder=\"First name and surname\"></label>\n<label class=\"lab\" data-field=\"3\">Phone<input class=\"fld\" type=\"tel\" name=\"input_3\" autocomplete=\"tel\" placeholder=\"04xx xxx xxx\"></label>\n<label class=\"lab\" data-field=\"4\">Email<input class=\"fld\" type=\"email\" name=\"input_4\" autocomplete=\"email\" placeholder=\"you@email.com\"></label>\n<label class=\"lab\" data-field=\"66\">Event type<select class=\"fld\" name=\"input_66\"><option value=\"\">Select…</option><option>Grand Prix (12+ yrs old)</option><option>Rapid Racing (12+ yrs old)</option><option>Birthday Package (11 yrs &amp; under)</option><option>Venue Hire</option></select></label>\n<label class=\"lab\" data-field=\"11\">Event date<input class=\"fld\" type=\"date\" name=\"input_11\"></label>\n<label class=\"lab\" data-field=\"12\">Event time<input class=\"fld\" type=\"time\" name=\"input_12\" step=\"900\"></label>\n<div data-when=\"input_66=Grand Prix (12+ yrs old)\" data-field=\"90\" class=\"lab\" hidden>Number of drivers (12+ · 6–70)<input class=\"fld\" type=\"number\" name=\"input_90\" min=\"6\" max=\"70\" placeholder=\"e.g. 12\"></div>\n<div data-when=\"input_66=Rapid Racing (12+ yrs old)\" data-field=\"91\" class=\"lab\" hidden>Number of drivers (12+ · 6–70)<input class=\"fld\" type=\"number\" name=\"input_91\" min=\"6\" max=\"70\" placeholder=\"e.g. 12\"></div>\n<div data-when=\"input_66=Birthday Package (11 yrs &amp; under)\" data-field=\"94\" class=\"lab span2\" hidden>Birthday package\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 8px; text-transform: none; letter-spacing: 0; font-size: 14px\">\n<label class=\"chk\"><input type=\"radio\" name=\"input_94\" value=\"Bronze Package\"> Bronze · $480 · 6 kids</label>\n<label class=\"ch DC.define("Estimator", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C; border: 2px solid #8C52FF; padding: 28px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; align-items: center\">\n<div>\n<p style=\"margin: 0 0 12px; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #5CE1E6\">Group estimate</p>\n<h3 class=\"disp\" style=\"font-size: clamp(30px, 3vw, 44px); margin-bottom: 10px\">How many<br>drivers?</h3>\n<div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px\"><span style=\"font: 700 64px/1.02 Aldrich, sans-serif; color: #FF00A1\">{{n}}</span><span style=\"font-size: 14px; color: #C9C9C5\">people</span></div>\n<label for=\"est-n\" style=\"display: block; font-size: 12px; color: #A1A1A6; margin-bottom: 6px\">Drag to set your group size (2–20)</label>\n<input id=\"est-n\" type=\"range\" min=\"2\" max=\"20\" step=\"1\" value=\"{{n}}\" data-on-change=\"{{setN}}\">\n<p style=\"margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: #A1A1A6\">Based on published prices; final price confirmed by email. Minimum ages apply.</p>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{rows}}\" as=\"r\">\n<a href=\"{{r.href}}\" style=\"display: grid; grid-template-columns: 1.3fr auto auto; gap: 14px; align-items: center; padding: 12px 14px; background: #151517; border: 1px solid #26262A; text-decoration: none; color: #F4F4F2\">\n<span><b style=\"display: block; font-size: 14px; text-transform: uppercase\">{{r.name}}</b><span style=\"font-size: 12px; color: #A1A1A6\">{{r.note}}</span></span>\n<span style=\"font-size: 12px; color: #A1A1A6; text-align: right\">{{r.pp}} pp</span>\n<span style=\"font: 700 26px/1.02 Aldrich, sans-serif; color: #FF00A1; text-align: right; min-width: 84px\">{{r.total}}</span>\n</a>\n</sc-for>\n<a class=\"btn\" href=\"events.html#enquiry\" style=\"background: #F4F4F2; color: #0B0B0C; margin-top: 6px\">Enquire for this group</a>\n</div>\n</div>",
  css: "body{margin:0;background:#0B0B0C}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\ninput[type=range]{accent-color:#FF00A1;width:100%}",
  defaults: {"start":8},
  logic: (function () {

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: null }; }
  renderVals() {
    const n = this.state.n ?? (this.props.start ?? 8);
    const pk = [
      ['Grand Prix race', 630, 6, 105, '12+ · 20 laps · 8+ drivers $100 pp', 'https://bookings.racefacer.com/ozekarts/package/adults-karts'],
      ['Rapid Racing', 420, 6, 70, '12+ · qualifying + 15 laps', 'https://bookings.racefacer.com/ozekarts/rapid-racing'],
      ['Junior party · Bronze', 480, 6, 70, 'Ages 6–11 · party room included', 'events.html#enquiry'],
      ['Junior party · Silver', 686, 7, 85, 'Ages 6–11 · medals for winners', 'events.html#enquiry'],
      ['Junior party · Gold', 840, 7, 100, 'Ages 6–11 · 3 off-track games', 'events.html#enquiry']
    ];
    const money = (v) => '$' + Math.round(v).toLocaleString('en-AU');
    const rows = pk.map(([name, base, incl, extra, note, href]) => {
      let total = base + Math.max(0, n - incl) * extra;
      if (name === 'Grand Prix race' && n >= 8) total = n * 100; // 8+ drivers: $100 per person
      return { name, note, href, total: money(total), pp: money(total / n) };
    });
    return { n, rows, setN: (e) => this.setState({ n: parseInt(e.target.value, 10) }) };
  }
}

  })()
});
