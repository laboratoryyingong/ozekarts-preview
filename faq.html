: #6D32D9\">01 — Frequently asked questions</p><h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px)\">Everything you<br>need to know</h2></div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px\">\n<sc-for list=\"{{topics}}\" as=\"t\">\n<button type=\"button\" data-on-click=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.name}}</button>\n</sc-for>\n</div>\n</div>\n<div class=\"faq-list\">\n<sc-for list=\"{{faqs}}\" as=\"f\">\n<button type=\"button\" class=\"q\" data-on-click=\"{{f.toggle}}\" style=\"background: #fff; color: #0B0B0C; border-color: #0B0B0C\"><span>{{f.q}}</span><span style=\"color: #6D32D9; font-size: 20px; line-height: 1\">{{f.icon}}</span></button>\n<sc-if value=\"{{f.open}}\"><div class=\"a\" style=\"background: #0B0B0C; color: #C9C9C5; border-color: #0B0B0C\"><sc-for list=\"{{f.paras}}\" as=\"p\"><p>{{p}}</p></sc-for></div></sc-if>\n</sc-for>\n</div>\n</div>\n</section>\n\n<!-- 03 Plan your visit -->\n<section class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<p class=\"eyebrow\">02 — First-time racers</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 36px\">Before you arrive</h2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<div class=\"card\" style=\"padding: 26px\"><span class=\"disp\" style=\"font-size: clamp(28px, 3.4vw, 48px); color: #39FF14; display: block; margin-bottom: 10px\">01</span><b style=\"font-size: 16px; text-transform: uppercase; display: block; margin-bottom: 8px\">Book online</b><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Choose Adelaide or Melbourne, pick a session, pay at booking. Walk-ins when space allows.</p></div>\n<div class=\"card\" style=\"padding: 26px\"><span class=\"disp\" style=\"font-size: clamp(28px, 3.4vw, 48px); color: #39FF14; display: block; margin-bottom: 10px\">02</span><b style=\"font-size: 16px; text-transform: uppercase; display: block; margin-bottom: 8px\">Register every driver</b><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Complete <a href=\"https://ozekarts.com.au/oz-e-karts-registration/\">driver registration</a> before you come to skip the queue at check-in.</p></div>\n<div class=\"card\" style=\"padding: 26px\"><span class=\"disp\" style=\"font-size: clamp(28px, 3.4vw, 48px); color: #39FF14; display: block; margin-bottom: 10px\">03</span><b style=\"font-size: 16px; text-transform: uppercase; display: block; margin-bottom: 8px\">Arrive 30 min early</b><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Check-in, briefing, helmet fitting. Enclosed shoes, no loose clothing; phones at your own risk. 0.00 BAC.</p></div>\n</div>\n</section>\n\n<dc-import name=\"Footer\"></dc-import>\n\n</div>",
  css: "body{margin:0;background:#0B0B0C}\nimg{max-width:100%}\n@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}\na{color:#39FF14}a:hover{color:#FFFFFF}\nsection[style*=\"#F3F2EC\"] a:not(.btn):not(.pill),section[style*=\"#F3F2EC\"] a:not(.btn):not(.pill):hover{color:#0B0B0C}\n.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D2A10D}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\n.rd,.body,.q,.a,.card p,.card b{font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif}\n.body{font-size:16px;line-height:1.6;color:#C9C9C5}\n.card{background:#151517;border:1px solid #26262A}\n.spec{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #26262A;font-size:14px}\n.q{width:100%;text-align:left;background:#151517;color:#F4F4F2;border:1px solid #26262A;border-bottom:0;padding:18px 20px;font:700 16px/1.4 \"Helvetica Neue\",Helvetica,Arial,sans-serif;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center}\n.q:last-of-type{border-bottom:1px solid #26262A}\n.a{background:#0B0B0C;border:1px solid #26262A;border-top:0;padding:16px 20px 20px;font-size:15px;line-height:1.7;color:#C9C9C5}\n.a p{margin:0 0 8px}.a p:last-child{margin:0}\n.faq-list{display:grid;grid-template-columns:1fr;gap:0;max-width:920px}",
  defaults: {},
  logic: (function () {

return class Component extends DCLogic {
  constructor(p) {
    super(p);
    // Deep links: faq.html#parties opens the parties topic (used from the Events page); #safety / #race from the Track page open Rules.
    const map = { bookings: 'Bookings & Payment', rules: 'Rules, Requirements & Information', race: 'Rules, Requirements & Information', safety: 'Rules, Requirements & Information', bring: 'What to bring', venue: 'Venue & Facilities', parties: 'Parties, Events & Groups', vouchers: 'Gift Vouchers & Specials', specials: 'Gift Vouchers & Specials' };
    let topic = 'Bookings & Payment';
    try { const h = (window.location.hash || '').replace('#', '').toLowerCase(); if (map[h]) topic = map[h]; } catch (e) {}
    this.state = { topic, open: {} };
  }
  renderVals() {
    // Copy from the client's FAQ document (31 Oct 2026). An answer may be a list of lines; lines starting with "• " are bullets.
    const data = {
      "Bookings & Payment": [
        ["Do you have a phone number?", "OZ EKARTS operates fully online! You can reach us via email, Messenger or Instagram."],
        ["Do I need to book in advance?", "While we accept walk-ins, they are subject to availability. We suggest booking in advance to avoid disappointment!"],
        ["Can I book without paying?", "Our booking system requires full, immediate payment in order to secure a timeslot. Unfortunately, this means that larger groups cannot pay separately when making an online booking."],
        ["Can I add drivers to my booking?", "After your booking has been made, our system allows a maximum of two additional drivers to be added and paid for upon arrival. Please email or message us with your booking code and request!"],
        ["What if a driver can't make it?", "No worries! Another person in your group can take their place in the session, as long as they meet the age, height and weight requirements for that kart. Just let our front counter team know at check-in. Please note that we do not offer refunds for no-shows."],
        ["Can I get a refund?", "We do not offer refunds for cancellations or no-shows. With at least 48 hours' notice, we can reschedule your session or try to resell your tickets; if they are resold, you receive a credit voucher for that value, less a reselling fee. To request a reschedule, refund or credit voucher, please use the form on our Contact page. Our Refund Policy and Rescheduling & No-Attendance Policy are linked there."]
      ],
      "Rules, Requirements & Information": [
        ["How fast do the karts go?", "Adult karts have a maximum speed of 35 km/h, while junior karts have a maximum speed of 15 km/h."],
        ["What types of karts do you offer?", "We run two types of fully electric karts! Adult karts (ages 12+) have instant torque, three speed settings and a top speed of 35 km/h. Junior karts (ages 6–11) are smaller and lighter, with a top speed of 15 km/h that our marshals adjust to suit each driver. Both are built to drift on our low-grip indoor track."],
        ["How long is a session?", "Adult sessions run for 10 minutes, while junior sessions run for 7 minutes."],
        ["How many people race at once?", "Our track can accommodate a maximum of 9 karts simultaneously."],
        ["Are lap times recorded?", "Yes! Every lap of every session is timed, and the live leaderboard shows your position while you race. Compare times with your friends, chase the lap record and track your progress each visit."],
        ["Can I drift?", "Yes! Our track and karts are specifically designed to drift. It isn't required to have a good time, though! Our karts can also be turned normally."],
        ["How long is the track?", "Our track is 188 metres long, with a total of 10 turns."],
        ["How many laps will I get?", "Adult sessions average 20–21 laps per race, while junior sessions average 10 laps."],
        ["Do I need experience?", "Not at all! While drifting might take some getting used to, our karts are perfectly safe for beginners."],
        ["Is go-karting safe?", "Yes! Our aim at OZ EKARTS is to provide adrenaline-packed fun, while keeping it fully safe. Our track marshals are trained on how to handle any situation, should it arise. Our front counter staff are also First Aid certified – you're in good hands!"],
        ["Are karts speed-limited for younger drivers?", "Yes! Junior karts have a lower top speed than adult karts, and our track marshals can adjust the speed of each kart to suit the driver. Younger or less confident drivers start slower and are turned up as they get the hang of it."],
        ["What are the on-track rules?", ["• Choosing the correct helmet size is your responsibility", "• Keep all limbs inside the kart", "• Keep both hands on the steering wheel", "• Tie long hair and tuck it into your shirt", "• Use the brake around turns", "• No intentionally bumping other karts", "• Listen and adhere to all track marshal instructions", "• Use one pedal at a time", "• Keep left for faster drivers", "• After your third warning from track marshals, you will be removed from the track", "• When entering the pit, remain seated until track marshals communicate otherwise"]],
        ["Do you have any medical restrictions or policies?", ["Your health is your responsibility. OZ EKARTS is here to facilitate safe, fun experiences, so we do not recommend racing if the following applies to you:", "• Heart conditions", "• Epilepsy", "• Pregnancy", "• Head, neck or back injuries", "If you are unsure as to whether it is safe for you to race, please contact us via email, Messenger or Instagram."]],
        ["What is our alcohol policy?", "All drivers must adhere to our 0.00% BAC policy. Random breath testing is conducted; if you are impaired at our venue, you will not be allowed to race."],
        ["Age, height and weight requirements?", ["Adult karts:", "• Minimum age: 12 years old", "• Minimum height: 140 cm", "• Maximum weight: 130 kg", "Junior karts:", "• Minimum age: 6 years old", "• Minimum height: 100 cm", "• Maximum weight: 55 kg"]],
        ["Can adults and juniors race together?", "Due to differences in size and speed, adult karts and junior karts do not share sessions; they alternate usage of the same indoor track."],
        ["How early should I arrive?", "We ask that all guests arrive 30 minutes prior to their first session to allow for adequate check-in and briefing time! This is also stipulated in your confirmation email."],
        ["What if I arrive late?", "While we aim to accommodate all customers and circumstances, arriving late means you may forfeit your session(s) if we are unable to move them back."]
      ],
      "What to bring": [
        ["What should I bring?", "Not much! Enclosed shoes, a hair tie if your hair is past your shoulders, and a drink bottle on hot days. A balaclava is required under our hire helmets; you can buy one at the front counter for $5 or bring your own. Everything else (helmet, briefing and a lot of adrenaline) is provided!"],
        ["What should I wear?", "Please do not wear loose or flowy clothing, as it may get caught in a kart. Please wear enclosed shoes; Crocs are acceptable, so long as they are in sports mode!"],
        ["Can I have my hair down?", "If your hair extends past your shoulders, we ask that you tie it and place it inside your shirt, to avoid it being caught in a kart."],
        ["Can I bring my own helmet?", "Yes! You are welcome to bring a helmet or balaclava from home. Your helmet must be Australian Standard and full-face. Bike helmets are not permitted."],
        ["Can I use my phone on track?", "We ask that all personal belongings (including your phone) be kept on our main viewing deck, or in a locker we provide. Bringing personal items onto the track increases your risk of damaging them. OZ EKARTS does not take responsibility for anything you choose to bring into your kart."],
        ["Are hired helmets cleaned?", "Absolutely! Our helmets are cleaned by marshals after every use."],
        ["Can I bring a recording device?", "Yes, we allow attachments that record your sessions! Please note that, while fun to watch your session back, there is a risk of personal items being damaged while on track. OZ EKARTS does not take responsibility for anything you choose to bring into your kart."]
      ],
      "Venue & Facilities": [
        ["Is the track indoors?", "Yes! Our track is fully indoors, making it perfect for all weather conditions."],
        ["Is the venue air-conditioned?", "Yes! Both our track and front counter area are air conditioned or heated, depending on the temperature."],
        ["Food and drinks?", "We currently do not offer catering. You are more than welcome to bring your own food and drinks to the venue (excluding alcohol)."],
        ["Is there parking?", "Our venue has a carpark at the front of the building, which also serves as our emergency evacuation point."],
        ["Can spectators watch?", "Absolutely! Our main viewing deck is spacious, and comfortably fits plenty of people."],
        ["When is it busiest?", "We tend to be busier on weekends and during school holidays. We are generally quieter on weekdays!"],
        ["Do you offer tandem karts?", "We do not offer tandem karts, as we encourage junior drivers to learn and develop their own driving skills."],
        ["Can I reserve a table?", "Yes! To reserve a table on our main viewing deck for your next booking, email info@ozekarts.com.au with your booking code and request. Table reservation is free of charge!"],
        ["What can I do in between sessions?", "Time between sessions varies from 5 to 10 minutes. On our main viewing deck, we have three different arcade games (Air Hockey, Dinosaur Blast, Cruis'n Blast), as well as claw machines in our front counter area. Many customers use this time to eat or drink, and take a breather before their next session!"]
      ],
      "Parties, Events & Groups": [
        ["What party packages do you offer?", ["We offer three different party packages for under-12 birthdays! All include access to our private party room.", "Bronze Party Package: 7-minute track session, 15-minute track session, 1 off-track game.", "Silver Party Package: 10-minute track game, 15-minute track session, 2 off-track games, medals for winners.", "Gold Party Package: 7-minute track session, 10-minute track game, 15-minute track session, 3 off-track games, medals for winners.", "See our Events page for prices, or send us an enquiry through the form there."]],
        ["What is the on-track game in the party packages?", "Musical Karts: similar to musical chairs, a 10-minute game in the karts run by our marshals. When the music stops, drivers must too!"],
        ["What are the off-track games?", "Choose between Jenga, Connect Four and Ring Toss to occupy drivers in between races! Bronze offers one, Silver offers two and Gold offers all three."],
        ["Can we bring food and cake?", "Yes! In the party room you will have access to a fridge, cups, plates and cutlery for any food and drinks you bring. We also offer a small selection of drinks and snacks for purchase!"],
        ["Do you offer catering?", "We do not offer catering at our venue. However, you're welcome to bring your own food or have catering delivered! Many groups order food such as pizza to the venue. In the event spaces you will have access to a fridge, plates, cutlery, cups and napkins."],
        ["Is this good for corporate events or team building?", "Yes! We frequently host company events. Karting is the perfect opportunity to build rapport and friendly fire with your team, or celebrate the end of the working year!"],
        ["Can I organise exclusive venue hire?", "Yes! Exclusive venue hire is available for corporate events, parties, schools and large groups: minimum 3 hours off-peak or 4 hours at peak times. See the venue hire section on our Events page and send us an enquiry."]
      ],
      "Gift Vouchers & Specials": [
        ["Can I use more than one voucher online?", "Unfortunately, our booking system only allows for one voucher to be used in each booking. We apologise for any inconvenience this may cause."],
        ["Can GroupOn vouchers be used online?", "GroupOn vouchers cannot be redeemed online, as they do not integrate with our booking system. Simply visit us Monday to Thursday and redeem your voucher at the front counter, subject to availability."],
        ["Do you sell gift vouchers?", "Yes, we do! We offer select dollar amount vouchers, as well as session-specific vouchers. Check out the Gift Vouchers link on our home page!"],
        ["How long do vouchers last?", "OZ EKARTS vouchers are valid for 3 years from their issue date, giving the recipient plenty of time to book their next sessions with us!"],
        ["What specials do you run?", "Monday Drifting Madness (buy 2 sessions, get 1 free), Wicked Wednesday ($25 adult sessions), Thursday Neon Nights and late-night karting till midnight on Fridays and Saturdays. See our Specials page for details."]
      ]
    };
    const names = Object.keys(data);
    const topic = this.state.topic;
    const topics = names.map((name) => ({
      name,
      pick: () => this.setState({ topic: name, open: {} }),
      style: (name === topic ? 'background: #0B0B0C; color: #A970FF; border: 2px solid #0B0B0C;' : 'background: transparent; color: #0B0B0C; border: 2px solid #0B0B0C;') + ' min-height: 40px; padding: 0 14px; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer'
    }));
    const faqs = data[topic].map(([q, a], i) => {
      const open = !!this.state.open[i];
      return { q, paras: Array.isArray(a) ? a : [a], open, icon: open ? '−' : '+', toggle: () => this.setState({ open: { ...this.state.open, [i]: !open } }) };
    });
    return { topics, faqs };
  }
}

  })()
});

    } catch (e) {}

    try {
      const root = this.__host.body, kart = root.querySelector('.lap .kart'), pct = root.querySelector('.lap .pct');
      const upd = () => { const max = document.documentElement.scrollHeight - window.innerHeight; const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0; kart.style.top = (p * 100) + '%'; pct.textContent = Math.round(p * 100) + '%'; };
