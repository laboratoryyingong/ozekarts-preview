@font-face{font-family:'Aldrich';src:url(assets/fonts/aldrich.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Dameron';src:url(assets/fonts/dameron.ttf) format('truetype')}
dc-root,dc-import{display:block}
@media (max-width:980px){.navmain.open{display:flex!important;flex-direction:column;flex-basis:100%;gap:14px;padding:12px 0}}
@media (max-width:700px){body{padding-bottom:58px}}
body{margin:0;background:#0B0B0C}
img{max-width:100%}
@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}.hero-wrap{padding-top:280px!important}}
a{color:#5CE1E6}a:hover{color:#FFFFFF}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}
.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5CE1E6}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.body{font-size:16px;line-height:1.6;color:#C9C9C5}
.card{background:#151517;border:1px solid #26262A}
a > span > svg{width:100%;height:auto;display:block}
.pcard{position:relative;display:block;min-height:420px;overflow:hidden;color:#F4F4F2;text-decoration:none;background:#151517}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover img{transform:scale(1.04)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 30%,rgba(11,11,12,.55) 60%,rgba(11,11,12,.95) 100%)}
.pcard .in{position:absolute;left:24px;right:24px;bottom:24px;z-index:1}
.pcard .tag{position:absolute;top:14px;left:14px;z-index:1;background:#5CE1E6;color:#0B0B0C;font:700 11px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px}
.pill{display:inline-block;background:#F4F4F2;color:#0B0B0C;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:999px}
.hot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.hot.on,.hot:hover,.hot:focus-within{z-index:30}
.pop{z-index:31}
.dot2{width:32px;height:32px;border-radius:50%;background:#8C52FF;color:#fff;border:2px solid rgba(255,255,255,.85);font:700 13px/28px Aldrich,sans-serif;text-align:center;padding:0;cursor:pointer;animation:hotpulse 2.2s infinite;transition:transform .2s,background .2s,color .2s}
.hot.on .dot2,.hot:hover .dot2{background:#5CE1E6;color:#0B0B0C;transform:scale(1.18);animation:none}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 rgba(140,82,255,.65)}70%{box-shadow:0 0 0 16px rgba(140,82,255,0)}100%{box-shadow:0 0 0 0 rgba(140,82,255,0)}}
.pop{position:absolute;left:46px;top:50%;width:240px;transform:translateY(-50%) translateX(-10px) scale(.96);opacity:0;pointer-events:none;background:rgba(11,11,12,.94);border:1px solid #5CE1E6;box-shadow:0 0 28px rgba(92,225,230,.35);padding:12px 14px;box-sizing:border-box;backdrop-filter:blur(6px);transition:opacity .2s,transform .28s cubic-bezier(.2,.9,.3,1.2)}
.pop::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;background:#0B0B0C;border-left:1px solid #5CE1E6;border-bottom:1px solid #5CE1E6;transform:translateY(-50%) rotate(45deg)}
.hot.flip .pop{left:auto;right:46px;transform:translateY(-50%) translateX(10px) scale(.96)}
.hot.flip .pop::before{left:auto;right:-6px;transform:translateY(-50%) rotate(-135deg)}
.hot.on .pop,.hot:hover .pop{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.pop b{display:block;font:700 12px/1.2 Aldrich,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5CE1E6;margin-bottom:5px}
.pop span{display:block;font-size:12px;line-height:1.5;color:#C9C9C5}
@media (max-width:700px){.pop{width:200px}}
.spec{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #26262A;font-size:14px}
</style>

DC.define("Main", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C; position: relative\">\n\n<dc-import name=\"Header\" active=\"home\" overlay=\"true\" style=\"position: absolute; top: 0; left: 0; right: 0; z-index: 30\"></dc-import>\n\n<!-- Hero -->\n<section style=\"position: relative; overflow: hidden; min-height: 760px; display: flex; align-items: center\">\n<video poster=\"assets/video/oze-video-hero-poster.webp\" preload=\"metadata\" autoplay muted loop playsinline aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><source src=\"assets/video/oze-video-hero.mp4\" type=\"video/mp4\"></video>\n<div style=\"position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,11,12,.6) 0%, rgba(11,11,12,.2) 40%, rgba(11,11,12,0) 65%)\"></div>\n<div class=\"wrap hero-wrap\" style=\"position: relative; width: 100%; padding-top: clamp(205px, 15vw, 235px); padding-bottom: 96px\">\n<span style=\"display: inline-block; background: #8C52FF; color: #fff; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px; margin-bottom: 26px\">Adelaide's first indoor electric drift go karting venue</span>\n<h1 class=\"disp\" style=\"font-size: clamp(34px, 3.7vw, 56px); max-width: 520px; letter-spacing: -.01em\">Full throttle.<br>Fully indoor.<br><span style=\"color: #5CE1E6\">Full drift.</span></h1>\n<p class=\"body\" style=\"max-width: 440px; margin: 18px 0 26px; font-size: 16px; color: #F4F4F2\">Adelaide's indoor electric drift karts. Race it, drift it, or book the whole crew.</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts\" style=\"background: #F4F4F2; color: #0B0B0C\">Book a session</a>\n<a href=\"https://vouchers.racefacer.com/ozekarts\" style=\"align-self: center; font: 700 13px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #F4F4F2; text-decoration: none; border-bottom: 1px solid #5CE1E6; padding-bottom: 3px\">Gift vouchers →</a>\n</div>\n</div>\n</section>\n\n<!-- Stat strip -->\n<section style=\"border-top: 4px solid #8C52FF; background: #111113\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; padding-top: 34px; padding-bottom: 34px\">\n<div><div class=\"disp\" style=\"font-size: clamp(24px, 2.4vw, 40px); color: #5CE1E6; white-space: nowrap\">188m</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Indoor track · 9 turns</div></div>\n<div><div class=\"disp\" style=\"font-size: clamp(24px, 2.4vw, 40px); color: #5CE1E6; white-space: nowrap\">Electric</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Instant torque · zero emissions</div></div>\n<div><div class=\"disp\" style=\"font-size: clamp(24px, 2.4vw, 40px); color: #5CE1E6; white-space: nowrap\">35 km/h</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Adult karts · 3 speed settings</div></div>\n<div><div class=\"disp\" style=\"font-size: clamp(24px, 2.4vw, 40px); color: #5CE1E6; white-space: nowrap\">Ages 6+</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Junior karts · rain or shine</div></div>\n</div>\n</section>\n\n<!-- 01 The circuit -->\n<section class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: center\">\n<div>\n<p class=\"eyebrow\">01 — The circuit</p>\n<h2 class=\"disp\" style=\"font-size: clamp(32px, 5.4vw, 76px); margin-bottom: 20px\">Built for<br>real drifting</h2>\n<p class=\"body\" style=\"margin: 0 0 28px\">Adelaide's first indoor electric drift venue: 188 m of low-grip concrete, hairpins and gradients, barriers throughout. Fully indoor, whatever the weather.</p>\n<p style=\"margin: 0 0 28px; font: 700 12px/1.9 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6\">Low-grip concrete · live lap timing · 7–9 karts on track · neon LED on Thursdays</p>\n<a class=\"btn\" href=\"racing.html#drift\" style=\"background: transparent; color: #F4F4F2; border: 1px solid #F4F4F2; clip-path: none\">What is drift karting</a>\n</div>\n<div style=\"position: relative\">\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/photos/events-IMG_20861.webp\" srcset=\"assets/photos/events-IMG_20861-480.webp 480w, assets/photos/events-IMG_20861-960.webp 960w, assets/photos/events-IMG_20861.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Overhead view of the Oz Ekarts indoor track\" style=\"width: 100%; height: 400px; object-fit: cover; display: block\">\n<span style=\"position: absolute; top: 16px; left: 16px; background: #0B0B0C; color: #5CE1E6; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px\">Holden Hill · SA</span>\n<a href=\"our-vision.html#track\" style=\"display: block; margin-top: 12px; position: relative; background: #111113; border: 1px solid #26262A\"><span style=\"display: block; line-height: 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1516\" role=\"img\" aria-label=\"OZ EKARTS circuit map: 188 metres, 10 turns\">\n<defs>\n<radialGradient id=\"halo\"><stop offset=\"0\" stop-color=\"#2ECC71\" stop-opacity=\".95\"/><stop offset=\".45\" stop-color=\"#2ECC71\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#2ECC71\" stop-opacity=\"0\"/></radialGradient>\n<pattern id=\"plan\" width=\"80\" height=\"80\" patternUnits=\"userSpaceOnUse\"><path d=\"M80 0 return class Component extends DCLogic {

  renderVals() {
    const d = new Date().getDay();
    const base = 'position: relative; display: block; padding: 24px; text-decoration: none; color: #F4F4F2; border-top: 3px solid ';
    const list = [
      [[1], 'Monday', 'Drifting madness', 'Buy 2 sessions, get 1 free. From 4 pm till close.', 'specials.html#mon', '#8C52FF'],
      [[3], 'Wednesday', 'Wicked Wednesday', 'Adult sessions $25 — save $14.', 'specials.html#wed', '#8C52FF'],
      [[4], 'Thursday', 'Neon Nights', 'Rainbow LED track from sunset till 9 pm.', 'specials.html#thu', '#8C52FF'],
      [[5, 6], 'Fri & Sat', 'Late night karting', 'Open till midnight. Walk-ins welcome.', 'specials.html#late', '#8C52FF']
    ];
    const specials = list.map(([days, day, name, text, href, c]) => {
      const today = days.includes(d);
      return { day, name, text, href, today, style: base + c + (today ? '; outline: 1px solid #5CE1E6' : '') };
    });
    // Hall of fame — sample data; swap for the RaceFacer export once confirmed.
    const boards = [
      { title: 'Adult karts · 10-min session', record: { time: '32.41s', name: 'Jake M.', when: 'Jul 2026' },
        months: [['October 2026', '32.88s', 'Liam T.'], ['September 2026', '32.41s', 'Jake M.'], ['August 2026', '33.05s', 'Priya S.']].map(([month, time, name]) => ({ month, time, name })) },
      { title: 'Junior karts · 7-min session', record: { time: '48.90s', name: 'Ava L.', when: 'Apr 2026' },
        months: [['October 2026', '49.62s', 'Noah K.'], ['September 2026', '49.10s', 'Ava L.'], ['August 2026', '50.31s', 'Mia R.']].map(([month, time, name]) => ({ month, time, name })) }
    ];
    // Interactive kart hotspots (x/y in % of the photo). Tap toggles, hover previews.
    const hot = this.state.hot;
    const spots = [
      [30, 74, 'Electric motor', 'Instant torque, no gears, no clutch. Up to 35 km/h for adults, 15 km/h for juniors.'],
      [50, 84, 'Battery pack', '100% electric and zero emissions — quiet enough to race indoors all day.'],
      [16, 58, 'Full-perimeter bumper', 'Absorbs contact so a nudge never ends your session.'],
      [80, 82, 'Slick tyres', 'Low-grip rubber on coated concrete, built for controlled slides.'],
      [62, 22, 'Roll hoop & headrest', 'Head and neck support in every kart, every session.'],
      [56, 48, 'Steering wheel · 3 speed modes', 'Three speed settings — our team sets the right one for you.']
    ].map(([x, y, title, desc], i) => ({
      n: i + 1, title, desc, pos: 'left: ' + x + '%; top: ' + y + '%',
      cls: 'hot' + (hot === i ? ' on' : '') + (x > 58 ? ' flip' : ''),
      toggle: () => this.setState({ hot: hot === i ? null : i })
    }));
    return { specials, eight: 8, boards, spots };
  }
}

  logic: (function () {

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { city: 'adl', chat: false }; }
  componentDidMount() {
    try { const c = window.localStorage.getItem('oze-city'); if (c === 'mel' || c === 'adl') this.setState({ city: c }); } catch (e) {}
    // The info bar is fixed to the top of the viewport; keep a spacer the same height so nothing hides under it.
    try {
      const root = this.__host.body, bar = root.querySelector('.infobar'), sp = root.querySelector('.infobar-spacer');
      const fit = () => { sp.style.height = bar.offsetHeight + 'px'; };
      fit(); new ResizeObserver(fit).observe(bar);
    } catch (e) {}
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    // overlay="true" (home): header floats over the hero video with a transparent, fading background.
    const overlay = String(this.props.overlay) === 'true';
    const city = this.state.city;
    const pick = (c) => () => { try { window.localStorage.setItem('oze-city', c); } catch (e) {} this.setState({ city: c }); };
    const on = 'background: #0B0B0C; color: #F4F4F2', off = 'background: transparent; color: #0B0B0C';
    // Drop-down menus (owner's brief): show the options under Events / Specials / Pricing without leaving the page.
    const sub = {
      karting: [['Racing', 'racing.html'], ['Drift karting', 'racing.html#drift'], ['Pricing', 'index.html#prices']],
      vision: [['Our story', 'our-vision.html'], ['Gallery', 'our-vision.html#gallery'], ['FAQ', 'faq.html']],
      events: [['Junior parties', 'events.html#packages'], ['Grand Prix & Rapid Racing', 'events.html#racing'], ['Venue hire', 'events.html#venue-hire'], ['Make an enquiry', 'events.html#enquiry']],
      specials: [['Monday · Drifting Madness', 'specials.html#mon'], ['Wicked Wednesday', 'specials.html#wed'], ['Thursday Neon Nights', 'specials.html#thu'], ['Fri & Sat · Late night karting', 'specials.html#late']]
    };
    const nav = [
      ['home', 'Home', 'index.html'], ['karting', 'Karting', 'racing.html'], ['events', 'Events & Parties', 'events.html'],
      ['specials', 'Specials', 'specials.html'], ['vision', 'Our Vision', 'our-vision.html'], ['contact', 'Contact', 'contact.html']
    ];
    const act = { racing: 'karting', faq: 'vision' }[active] || active;
    const d = new Date().getDay();
    const oz = window.OZE ? window.OZE.today() : null;
    const hrs = oz ? (oz.closed ? 'Closed today (' + oz.day + ')' : oz.hours) : ['10:00am – 9:00pm', '12:00pm – 9:00pm', 'Closed today (Tuesday)', '12:00pm – 9:00pm', '12:00pm – 10:00pm', '10:00am – 12:00am', '9:00am – 12:00am'][d];
    const closedToday = oz ? oz.closed : d === 2;
    const holiday = !!(oz && oz.holiday);
    const specials = {
      1: ['Drifting Madness · buy 2 get 1 free from 4pm', 'specials.html#mon'],
      3: ['Wicked Wednesday · $25 adult sessions', 'specials.html#wed'],
      4: ['Neon Nights · rainbow LEDs from sunset', 'specials.html#thu'],
      5: ['Late night karting · open till midnight', 'specials.html#late'],
      6: ['Late night karting · open till midnight', 'specials.html#late']
    };
    const sp = specials[d];
    return {
      chatOpen: this.state.chat, chatCls: 'chaty' + (this.state.chat ? ' open' : ''), toggleChat: () => this.setState({ chat: !this.state.chat }),
      rootStyle: 'width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: ' + (overlay ? 'transparent' : '#0B0B0C'),
      barStyle: overlay ? 'background: linear-gradient(180deg, rgba(11,11,12,.78) 0%, rgba(11,11,12,.45) 60%, rgba(11,11,12,0) 100%)' : 'border-bottom: 1px solid #222226',
      cityName: city === 'mel' ? 'Melbourne' : 'Adelaide',
      todayLine: city === 'mel' ? 'Melbourne hours on ozekartsvic.com.au' : (closedToday ? hrs : 'Open today ' + hrs) + (holiday ? ' · School holidays' : ''),
      hasSpecial: city === 'adl' && !!sp, special: sp ? sp[0] : '', specialHref: sp ? sp[1] : '#',
      bookHref: city === 'mel' ? 'https://ozekartsvic.com.au' : 'https://bookings.racefacer.com/ozekarts',
      voucherHref: city === 'mel' ? 'https://ozekartsvic.com.au' : 'https://vouchers.racefacer.com/ozekarts',
      pickAdl: pick('adl'), pickMel: pick('mel'), adlStyle: city === 'adl' ? on : off, melStyle: city === 'mel' ? on : off,
      items: nav.map(([id, label, href]) => ({
        label, href, sub: sub[id] ? sub[id].map(([label, href]) => ({ label, href })) : null,
        style: id === act ? 'color: #5CE1E6; text-decoration: none; padding: 10px 0; border-bottom: 2px solid #5CE1E6' : 'color: #F4F4F2; text-decoration: none; padding: 10px 0; border-bottom: 2px solid transparent'
      }))
    };
  }
}

  })()
});
DC.define("Estimator", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C; border: 2px solid #8C52FF; padding: 28px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; align-items: center\">\n<div>\n<p style=\"margin: 0 0 12px; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #5CE1E6\">Group estimate</p>\n<h3 class=\"disp\" style=\"font-size: clamp(30px, 3vw, 44px); margin-bottom: 10px\">How many<br>drivers?</h3>\n<div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px\"><span class=\"disp\" style=\"font-size: 64px; font-style: normal; color: #5CE1E6\">{{n}}</span><span style=\"font-size: 14px; color: #C9C9C5\">people</span></div>\n<label for=\"est-n\" style=\"display: block; font-size: 12px; color: #A1A1A6; margin-bottom: 6px\">Drag to set your group size (2–20)</label>\n<input id=\"est-n\" type=\"range\" min=\"2\" max=\"20\" step=\"1\" value=\"{{n}}\" data-on-change=\"{{setN}}\">\n<p style=\"margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: #A1A1A6\">Based on published prices; final price confirmed by email. Minimum ages apply.</p>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{rows}}\" as=\"r\">\n<a href=\"{{r.href}}\" style=\"display: grid; grid-template-columns: 1.3fr auto auto; gap: 14px; align-items: center; padding: 12px 14px; background: #151517; border: 1px solid #26262A; text-decoration: none; color: #F4F4F2\">\n<span><b style=\"display: block; font-size: 14px; text-transform: uppercase\">{{r.name}}</b><span style=\"font-size: 12px; color: #A1A1A6\">{{r.note}}</span></span>\n<span style=\"font-size: 12px; color: #A1A1A6; text-align: right\">{{r.pp}} pp</span>\n<span class=\"disp\" style=\"font-size: 26px; font-style: normal; color: #5CE1E6; text-align: right; min-width: 84px\">{{r.total}}</span>\n</a>\n</sc-for>\n<a class=\"btn\" href=\"events.html#enquiry\" style=\"background: #F4F4F2; color: #0B0B0C; margin-top: 6px\">Enquire for this group</a>\n</div>\n</div>",
  css: "body{margin:0;background:#0B0B0C}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\ninput[type=range]{accent-color:#5CE1E6;width:100%}",
  defaults: {"start":8},
  logic: (function () {

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: null }; }
  renderVals() {
    const n = this.state.n ?? (this.props.start ?? 8);
    const pk = [
      ['Grand Prix race', 630, 6, 105, '12+ · 20 laps · 8+ drivers $100 pp', 'https://bookings.racefacer.com/ozekarts/package/adults-karts'],
      ['Rapid Racing', 420, 6, 70, '12+ · qualifying + 15 laps', 'https://bookings.racefacer.com/ozekarts/rapid-racing'],
      ['Junior party · Bronze', 480, 6, 70, 'Ages 6–9 · party room included', 'events.html#enquiry'],
      ['Junior party · Silver', 686, 7, 85, 'Ages 6–9 · medals for winners', 'events.html#enquiry'],
      ['Junior party · Gold', 840, 7, 100, 'Ages 6–9 · 3 off-track games', 'events.html#enquiry']
    ];
    const money = (v) => '$' + Math.round(v).toLocaleString('en-AU');
    const rows = pk.map(([name, base, incl, extra, note, href]) => {
      let total = base + Math.max(0, n - incl) * extra;
      if (name === 'Grand Prix race' && n >= 8) total = n * 100; // 8+ drivers: $100 per person
      return { name, note, href, total: money(total), pp: money(total / n) };
    });
    return { n, rows, setN: (e) => this.setState({ n: parseInt(e.target.value, 10) }) };
  }
}

  })()

    const wk = window.OZE ? window.OZE.week() : null;
