body{margin:0;background:#0B0B0C}
img{max-width:100%}
@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}.hero-wrap{padding-top:280px!important}.hero-h1{font-size:clamp(48px,14vw,64px)!important;text-shadow:0 0 8px rgba(255,0,161,.8),0 0 28px rgba(255,0,161,.55)!important}}
a{color:#39FF14}a:hover{color:#FFFFFF}
section[style*="#F3F2EC"] a:not(.btn):not(.pill),section[style*="#F3F2EC"] a:not(.btn):not(.pill):hover{color:#0B0B0C}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}
.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D2A10D}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.body{font-size:16px;line-height:1.6;color:#C9C9C5}
.card{background:#151517;border:1px solid #26262A}
a > span > svg{width:100%;height:auto;display:block}
.pcard{position:relative;display:block;min-height:420px;overflow:hidden;color:#F4F4F2;text-decoration:none;background:#151517}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover img{transform:scale(1.04)}
.pcard:nth-child(4n+2) .tag{background:#39FF14}.pcard:nth-child(4n+3) .tag{background:#5CE1E6}.pcard:nth-child(4n+4) .tag{background:#A970FF}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 30%,rgba(11,11,12,.55) 60%,rgba(11,11,12,.95) 100%)}
.pcard .in{position:absolute;left:24px;right:24px;bottom:24px;z-index:1}
.pcard .tag{position:absolute;top:14px;left:14px;z-index:1;background:#FF00A1;color:#0B0B0C;font:700 11px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px}
.pill{display:inline-block;background:#F4F4F2;color:#0B0B0C;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:999px}
.hot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.hot.on,.hot:hover,.hot:focus-within{z-index:30}
.pop{z-index:31}
.dot2{width:32px;height:32px;border-radius:50%;background:#8C52FF;color:#fff;border:2px solid rgba(255,255,255,.85);font:700 13px/28px Aldrich,sans-serif;text-align:center;padding:0;cursor:pointer;animation:hotpulse 2.2s infinite;transition:transform .2s,background .2s,color .2s}
.hot.on .dot2,.hot:hover .dot2{background:#FF00A1;color:#fff;color:#0B0B0C;transform:scale(1.18);animation:none}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 rgba(140,82,255,.65)}70%{box-shadow:0 0 0 16px rgba(140,82,255,0)}100%{box-shadow:0 0 0 0 rgba(140,82,255,0)}}
.pop{position:absolute;left:46px;top:50%;width:240px;transform:translateY(-50%) translateX(-10px) scale(.96);opacity:0;pointer-events:none;background:rgba(11,11,12,.94);border:1px solid #FF00A1;box-shadow:0 0 28px rgba(255,0,161,.35);padding:12px 14px;box-sizing:border-box;backdrop-filter:blur(6px);transition:opacity .2s,transform .28s cubic-bezier(.2,.9,.3,1.2)}
.pop::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;background:#0B0B0C;border-left:1px solid #FF00A1;border-bottom:1px solid #FF00A1;transform:translateY(-50%) rotate(45deg)}
.hot.flip .pop{left:auto;right:46px;transform:translateY(-50%) translateX(10px) scale(.96)}
.hot.flip .pop::before{left:auto;right:-6px;transform:translateY(-50%) rotate(-135deg)}
.hot.on .pop,.hot:hover .pop{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.pop b{display:block;font:700 12px/1.2 Aldrich,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#FF00A1;margin-bottom:5px}
.pop span{display:block;font-size:12px;line-height:1.5;color:#C9C9C5}
@media (max-width:700px){.pop{width:200px}}
.hotinfo{display:none}
.pop span:empty,.hotinfo span:empty{display:none}.pop b:last-of-type{margin-bottom:0}
.hof{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #26262A;font-size:14px}
@media (max-width:700px){.pop{display:none}.hotinfo{display:block;margin-top:12px;background:#0B0B0C;border:1px solid #FF00A1;padding:12px 14px}.hotinfo b{display:block;font:700 12px/1.2 Aldrich,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#FF00A1;margin-bottom:5px}.hotinfo span{font-size:13px;line-height:1.5;color:#C9C9C5}.hof{flex-wrap:wrap}.hof span,.hof b{min-width:0!important}.hero-wrap{text-align:center}.hero-wrap > div{justify-content:center}.stats > div{text-align:center}}
.spec{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #26262A;font-size:14px}
.spec b{text-align:right}
</style>

DC.define("Main", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C; position: relative\">\n\n<dc-import name=\"Header\" active=\"home\" overlay=\"true\" style=\"position: absolute; top: 0; left: 0; right: 0; z-index: 30\"></dc-import>\n\n<!-- Hero -->\n<section style=\"position: relative; overflow: hidden; min-height: 760px; display: flex; align-items: center\">\n<video poster=\"assets/video/oze-video-hero-poster.webp\" preload=\"metadata\" autoplay muted loop playsinline aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><source src=\"assets/video/oze-video-hero.mp4\" type=\"video/mp4\"></video>\n<div style=\"position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,11,12,.6) 0%, rgba(11,11,12,.2) 40%, rgba(11,11,12,0) 65%)\"></div>\n<div class=\"wrap hero-wrap\" style=\"position: relative; width: 100%; padding-top: clamp(205px, 15vw, 235px); padding-bottom: 96px\">\n<span style=\"display: inline-block; color: #fff; font: 700 13px/1.4 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.6); margin-bottom: 22px\">First indoor electric drift karting | Australia</span>\n<h1 class=\"disp hero-h1\" style=\"font-size: clamp(34px, 3.7vw, 56px); max-width: 520px; letter-spacing: -.01em; color: #FF00A1; text-shadow: 0 0 6px rgba(255,0,161,.7), 0 0 22px rgba(255,0,161,.45)\">Slide<br>into fun</h1>\n<p class=\"body\" style=\"max-width: 440px; margin: 18px 0 26px; font-size: 16px; color: #F4F4F2\">Adelaide's indoor electric go karting venue in Holden Hill. Adult and junior karts, drift and race sessions, birthday parties and corporate events.</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts\" style=\"background: #F4F4F2; color: #0B0B0C\">Book a session</a>\n<a href=\"https://vouchers.racefacer.com/ozekarts\" style=\"align-self: center; font: 700 13px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #F4F4F2; text-decoration: none; border-bottom: 1px solid #FF00A1; padding-bottom: 3px\">Gift vouchers →</a>\n</div>\n</div>\n</section>\n\n<!-- Stat strip -->\n<section style=\"border-top: 4px solid #8C52FF; background: #111113\">\n<div class=\"wrap stats\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; padding-top: 34px; padding-bottom: 34px\">\n<div><div style=\"font: 700 clamp(24px, 2.4vw, 40px)/1.02 Aldrich, sans-serif; text-transform: uppercase; color: #39FF14; white-space: nowrap\">188m</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Indoor track · 10 turns</div></div>\n<div><div style=\"font: 700 clamp(24px, 2.4vw, 40px)/1.02 Aldrich, sans-serif; text-transform: uppercase; color: #39FF14; white-space: nowrap\">Electric</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Instant torque · zero emissions</div></div>\n<div><div style=\"font: 700 clamp(24px, 2.4vw, 40px)/1.02 Aldrich, sans-serif; text-transform: uppercase; color: #39FF14; white-space: nowrap\">35 km/h</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Adult karts · 3 speed settings</div></div>\n<div><div style=\"font: 700 clamp(24px, 2.4vw, 40px)/1.02 Aldrich, sans-serif; text-transform: uppercase; color: #39FF14; white-space: nowrap\">Ages 6+</div><div style=\"font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6; margin-top: 8px\">Junior karts · build confidence</div></div>\n</div>\n</section>\n\n<!-- 01 The circuit -->\n<section class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: center\">\n<div>\n<p class=\"eyebrow\">01 — The circuit</p>\n<h2 class=\"disp\" style=\"font-size: clamp(32px, 5.4vw, 76px); margin-bottom: 20px\">Built for<br>real drifting</h2>\n<p class=\"body\" style=\"margin: 0 0 28px\">Adelaide's first indoor electric drift venue: 188 m of low-grip concrete, hairpins and gradients, barriers throughout. Fully indoor, whatever the weather.</p>\n<p style=\"margin: 0 0 28px; font: 700 12px/1.9 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #A1A1A6\">Low-grip concrete · live lap timing · Up to 9 karts on track · weekly specials</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\"><a class=\"btn\" href=\"track.html\" style=\"background: #F4F4F2; color: #0B0B0C\">Explore the track</a>\n<a class=\"btn\" href=\"racing.html\" style=\"background: transparent; color: #F4F4F2; border: 1px solid #F4F4F2; clip-path: none\">See race formats</a></div>\n</div>\n<div style=\"position: relative\">\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/photos/events-IMG_20861.webp\" srcset=\"assets/photos/events-IMG_20861-480.webp 480w, assets/photos/events-IMG_20861-960.webp 960w, assets/photos/events-IMG_20861.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Overhead view of the Oz Ekarts indoor track\" style=\"width: 100%; height: 400px; object-fit: cover; display: block\">\n<span style=\"position: absolute; top: 16px; left: 16px; background: #0B0B0C; color: #5CE1E6; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px\">Holden Hill · SA</span>\n<a href=\"track.html\" style=\"display: block; margin-top: 12px; background: #fff; border: 1px solid #26262A; text-decoration: none\"><span style=\"display: block; height: 440px; padding: 12px; line-height: 0\"><img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/track-map.webp\" srcset=\"assets/photos/track-map-480.webp 480w, assets/photos/track-map-960.webp 960w, assets/photos/track-map.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" width=\"1760\" height=\"2300\" alt=\"OZ EKARTS track map, Holden Hill: 10 numbered turns with accelerate, roll and brake zones, start and finish, pit and viewing deck\" style=\"width: 100%; height: 100%; object-fit: contain; display: block\"></span><span style=\"display: block; background: #0B0B0C; color: #5CE1E6; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 12px\">Track map · 188 m · 10 turns →</span></a>\n</div>\n</section>\n\n<!-- 02 Prices (off-white) -->\n<section id=\"prices\" style=\"background: #F3F2EC; color: #0B0B0C\">\n<div class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px\">\n<div><p class=\"eyebrow\" style=\"color: #6D32D9\">02 — Prices</p><h2 class=\"disp\" style=\"font-size: clamp(34px, 5.7vw, 80px)\">Pick your kart</h2></div>\n<p style=\"max-width: 400px; font-size: 15px; line-height: 1.55; color: #3A3A3A; margin: 0; text-align: justify\">Helmet, briefing and live lap timing included. Arrive 30 minutes early and complete <a href=\"https://ozekarts.com.au/oz-e-karts-registration/\" style=\"color: #0B0B0C\">driver registration</a> first.</p>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; background: #fff; border: 2px solid #0B0B0C; padding: 14px 18px; margin: -12px 0 32px; font-size: 14px; line-height: 1.5; color: #0B0B0C\">\n<b style=\"font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6D32D9\">Please note</b>\n<span>Drivers must meet <b>all</b> requirements.</span>\n<span>Under 18s: a parent or guardian completes <a href=\"https://ozekarts.com.au/oz-e-karts-registration/\" style=\"color: #0B0B0C\">driver registration</a>.</span>\n<span>0.00 BAC · enclosed shoes · max 130 kg.</span>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n\n<article style=\"background: #0B0B0C; color: #F4F4F2; border: 2px solid #0B0B0C; display: flex; flex-direction: column; position: relative\">\n<span style=\"position: absolute; top: -14px; right: 18px; background: #F4F4F2; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Most popular</span>\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/adult-kart.webp\" srcset=\"assets/photos/adult-kart-480.webp 480w, assets/photos/adult-kart-960.webp 960w, assets/photos/adult-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Adult electric go kart racing indoors at Oz Ekarts Adelaide\" style=\"width: 100%; height: 200px; object-fit: cover; display: block\">\n<div style=\"padding: 26px; display: flex; flex-direction: column; gap: 12px; flex: 1\">\n<p class=\"eyebrow\" style=\"margin: 0\">Adult · ages 12+</p>\n<h3 class=\"disp\" style=\"font-size: clamp(28px, 3.1vw, 44px)\">Adult kart</h3>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.6vw, 64px)/1.02 Aldrich, sans-serif; color: #A970FF\">$39</span><span style=\"font-size: 14px; color: #C9C9C5\">10-min session</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Extra session $29</p>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; color: #C9C9C5\"><li>Min height 140 cm · max weight 130 kg</li><li>Various speed settings · up to 35 km/h</li><li>Lap times recorded</li></ul>\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/karting/12-years\" style=\"background: #F4F4F2; color: #0B0B0C; margin-top: auto\">Book adult</a>\n</div>\n</article>\n\n<article style=\"background: #fff; border: 2px solid #0B0B0C; display: flex; flex-direction: column\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/junior-kart.webp\" srcset=\"assets/photos/junior-kart-480.webp 480w, assets/photos/junior-kart-960.webp 960w, assets/photos/junior-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kids go karting with helmet\" style=\"width: 100%; height: 200px; object-fit: cover; display: block\">\n<div style=\"padding: 26px; display: flex; flex-direction: column; gap: 12px; flex: 1\">\n<p class=\"eyebrow\" style=\"margin: 0; color: #0B0B0C\">Junior · ages 6–11</p>\n<h3 class=\"disp\" style=\"font-size: clamp(28px, 3.1vw, 44px)\">Junior kart</h3>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font: 700 clamp(28px, 4.6vw, 64px)/1.02 Aldrich, sans-serif\">$25</span><span style=\"font-size: 14px; color: #3A3A3A\">7-min session</span></div>\n<p style=\"margin: 0; font-size: 14px; font-weight: 700\">Extra session $20</p>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; color: #2A2A2A\"><li>Min height 100 cm · max weight 55 kg</li><li>Max 15 km/h, adjusted to ability</li><li>Race separate to adults</li></ul>\n<p style=\"margin: 0; font-size: 14px; color: #3A3A3A\">Recommended for ages 6–9</p>\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/karting/11-under-junior-karts\" style=\"background: #0B0B0C; color: #F4F4F2; margin-top: auto\">Book junior</a>\n</div>\n</article>\n\n<article style=\"background: #fff; border: 2px solid #0B0B0C; display: flex; flex-direction: column\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/voucher.webp\" srcset=\"assets/photos/voucher-480.webp 480w, assets/photos/voucher-960.webp 960w, assets/photos/voucher.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Oz-E Karts venue at night\" style=\"width: 100%; height: 200px; object-fit: cover; object-position: center top; display: block\">\n<div style=\"padding: 26px; display: flex; flex-direction: column; gap: 12px; flex: 1\">\n<p class=\"eyebrow\" style=\"margin: 0; color: #0B0B0C\">Give the gift of adrenaline</p>\n<h3 class=\"disp\" style=\"font-size: clamp(28px, 3.1vw, 44px)\">Gift voucher</h3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #2A2A2A\">Single, double or triple sessions, or any amount.</p>\n<div style=\"display: flex; gap: 10px\"><span style=\"flex: 1; border: 2px solid #0B0B0C; text-align: center; padding: 12px 0; font-weight: 700\">$50</span><span style=\"flex: 1; border: 2px solid #0B0B0C; text-align: center; padding: 12px 0; font-weight: 700\">$100</span><span style=\"flex: 1; border: 2px solid #0B0B0C; text-align: center; padding: 12px 0; font-weight: 700\">$200</span></div>\n<a class=\"btn\" href=\"https://vouchers.racefacer.com/ozekarts\" style=\"background: #0B0B0C; color: #F4F4F2; margin-top: auto\">Buy your voucher now</a>\n</div>\n</article>\n\n</div>\n</div>\n</section>\n\n<!-- 03 More ways to race -->\n<section class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<p class=\"eyebrow\">03 — More ways to race</p>\n<h2 class=\"disp\" style=\"font-size: clamp(34px, 5.7vw, 80px); margin-bottom: 40px\">Race day.<br>Drift night.</h2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<a href=\"https://bookings.racefacer.com/ozekarts/karting/12-years\" class=\"pcard\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/drifting-IMG_3999.webp\" srcset=\"assets/photos/drifting-IMG_3999-480.webp 480w, assets/photos/drifting-IMG_3999-960.webp 960w, assets/photos/drifting-IMG_3999.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kart drifting through neon light trails\">\n<span class=\"tag\">From $39 · 10 min</span>\n<div class=\"in\"><h3 c   logic: (function () {

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { hot: null }; }
  renderVals() {
    const d = new Date().getDay();
    const base = 'position: relative; display: block; padding: 24px; text-decoration: none; color: #F4F4F2; border-top: 3px solid ';
    const list = [
      [[1], 'Monday', 'Drifting madness', 'Buy 2 sessions, get 1 free. All day, every Monday.', 'specials.html#mon', '#8C52FF'],
      [[3], 'Wednesday', 'Wicked Wednesday', 'Adult sessions $25, save $14.', 'specials.html#wed', '#8C52FF'],
      [[4], 'Thursday', 'Neon Nights', 'Rainbow LED track all day, every Thursday.', 'specials.html#thu', '#8C52FF'],
      [[5, 6], 'Fri & Sat', 'Late night karting', 'Open till midnight. Walk-ins welcome.', 'specials.html#late', '#8C52FF']
    ];
    const specials = list.map(([days, day, name, text, href, c]) => {
      const today = days.includes(d);
      return { day, name, text, href, today, style: base + c + (today ? '; outline: 1px solid #5CE1E6' : '') };
    });
    // Hall of fame — sample data; swap for the RaceFacer export once confirmed.
    const boards = [
      { title: 'Adult karts · 10-min session', record: { time: '32.41s', name: 'Jake M.', when: 'Jul 2026' },
        months: [['October 2026', '32.88s', 'Liam T.'], ['September 2026', '32.41s', 'Jake M.'], ['August 2026', '33.05s', 'Priya S.']].map(([month, time, name]) => ({ month, time, name })) },
      { title: 'Junior karts · 7-min session', record: { time: '48.90s', name: 'Ava L.', when: 'Apr 2026' },
        months: [['October 2026', '49.62s', 'Noah K.'], ['September 2026', '49.10s', 'Ava L.'], ['August 2026', '50.31s', 'Mia R.']].map(([month, time, name]) => ({ month, time, name })) }
    ];
    // Interactive kart hotspots (x/y in % of the photo). Tap toggles, hover previews.
    const hot = this.state.hot;
    const spots = [
      [43, 36, 'Electric motor', '48 Nm peak torque (petrol hire karts: up to about 19 Nm).'],
      [66, 40, 'Differential', 'Built for drifting.'],
      [74, 57, 'High performance battery pack', '100% electric and zero emissions.'],
      [51, 48, 'Steering wheel', ''],
      [56, 70, 'Adjustable pedals', ''],
      [22, 68, 'Drift tyres', ''],
      [62, 22, 'Roll bar & headrest', ''],
      [49, 90, 'Full-perimeter bumper', '']
    ].map(([x, y, title, desc], i) => ({
      n: i + 1, title, desc, pos: 'left: ' + x + '%; top: ' + y + '%',
      cls: 'hot' + (hot === i ? ' on' : '') + (x > 58 ? ' flip' : ''),
      toggle: () => this.setState({ hot: hot === i ? null : i })
    }));
    const cur = hot === null ? null : spots[hot];
    return { specials, eight: 8, boards, spots, hotOn: !!cur, hotOff: !cur, hotTitle: cur ? cur.title : '', hotDesc: cur ? cur.desc : '' };
  }
}

  })()
});

    } catch (e) {}

    try {
      const root = this.__host.body, kart = root.querySelector('.lap .kart'), pct = root.querySelector('.lap .pct');
      const upd = () => { const max = document.documentElement.scrollHeight - window.innerHeight; const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0; kart.style.top = (p * 100) + '%'; pct.textContent = Math.round(p * 100) + '%'; };

DC.define("Estimator", {

tyle=\"background: #F4F4F2; color: #0B0B0C; margin-top: 6px\">Enquire for this group</a>\n</div>\n</div>",
  css: "body{margin:0;background:#0B0B0C}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\ninput[type=range]{accent-color:#FF00A1;width:100%}",
  defaults: {"start":8},
  logic: (function () {

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: null }; }
  renderVals() {
    const n = this.state.n ?? (this.props.start ?? 8);
    const pk = [
      ['Grand Prix race', 630, 6, 105, '12+ · 20 laps · 8+ drivers $100 pp', 'https://bookings.racefacer.com/ozekarts/package/adults-karts'],
      ['Rapid Racing', 420, 6, 70, '12+ · qualifying + 15 laps', 'https://bookings.racefacer.com/ozekarts/rapid-racing'],

      ['Junior party · Silver', 686, 7, 85, 'Ages 6–11 · medals for winners', 'events.html#enquiry'],
      ['Junior party · Gold', 840, 7, 100, 'Ages 6–11 · 3 off-track games', 'events.html#enquiry']
    ];
    const money = (v) => '$' + Math.round(v).toLocaleString('en-AU');
    const rows = pk.map(([name, base, incl, extra, note, href]) => {

      return { name, note, href, total: money(total), pp: money(total / n) };

  }
}

  })()
});
