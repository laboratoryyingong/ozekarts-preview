.pb::before{content:"";width:8px;height:8px;border-radius:50%;background:#5CE1E6;flex:none}
.pb b{color:#F4F4F2;margin-right:6px}

.q{width:100%;text-align:left;background:#151517;color:#F4F4F2;border:1px solid #26262A;border-bottom:0;padding:18px 20px;font:700 15px/1.4 Aldrich,sans-serif;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center}
.q:last-of-type{border-bottom:1px solid #26262A}

DC.define("Vision", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C\">\n\n<dc-import name=\"Header\" active=\"vision\"></dc-import>\n\n<section style=\"position: relative; overflow: hidden; min-height: 520px; display: flex; align-items: flex-end\">\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/photos/header-IMG_2111.webp\" srcset=\"assets/photos/header-IMG_2111-480.webp 480w, assets/photos/header-IMG_2111-960.webp 960w, assets/photos/header-IMG_2111.webp 1800w\" sizes=\"100vw\" alt=\"Neon-lit track with the Oz-E Karts mural\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n<div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,12,.2) 0%, #0B0B0C 100%)\"></div>\n<div class=\"wrap\" style=\"position: relative; width: 100%; padding-top: 90px; padding-bottom: 56px\">\n<span style=\"display: inline-block; background: #8C52FF; color: #fff; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px; margin-bottom: 22px\">About OZ EKARTS</span>\n<h1 class=\"disp\" style=\"font-size: clamp(34px, 3.7vw, 56px); max-width: 520px\">The future of go karting.<br><span style=\"color: #5CE1E6\">Electric. Indoor. Adelaide.</span></h1>\n<p class=\"body\" style=\"max-width: 440px; margin: 18px 0 0; font-size: 16px; color: #F4F4F2\">A unique venue with thrills for all ages: high-torque karts and a slippery track turn every race into an adrenaline-packed challenge.</p>\n</div>\n</section>\n\n<!-- 01 What we run -->\n<section class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<p class=\"eyebrow\">01 — What we run</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 32px\">Two karts. One track.<br>Every occasion.</h2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<a href=\"https://bookings.racefacer.com/ozekarts/karting/12-years\" class=\"pcard\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/adult-kart.webp\" srcset=\"assets/photos/adult-kart-480.webp 480w, assets/photos/adult-kart-960.webp 960w, assets/photos/adult-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Adult kart\">\n<span class=\"tag\">12+ · 140 cm min · 130 kg max</span>\n<div class=\"in\"><h3 class=\"disp\" style=\"font-size: 32px; margin-bottom: 8px\">Adult racing</h3><p style=\"margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Instant torque, differential drive, three speed settings.</p><span class=\"pill\">Book here</span></div>\n</a>\n<a href=\"https://bookings.racefacer.com/ozekarts/karting/11-under-junior-karts\" class=\"pcard\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/junior-kart.webp\" srcset=\"assets/photos/junior-kart-480.webp 480w, assets/photos/junior-kart-960.webp 960w, assets/photos/junior-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Junior kart\">\n<span class=\"tag\">6–11 · 100 cm min · 55 kg max</span>\n<div class=\"in\"><h3 class=\"disp\" style=\"font-size: 32px; margin-bottom: 8px\">Kids racing</h3><p style=\"margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Ages 6–11 (best 6–9). Speed set to each child; up to 9 race together.</p><span class=\"pill\">Book here</span></div>\n</a>\n<a href=\"#track\" class=\"pcard\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_20861.webp\" srcset=\"assets/photos/events-IMG_20861-480.webp 480w, assets/photos/events-IMG_20861-960.webp 960w, assets/photos/events-IMG_20861.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Overhead view of the indoor track\">\n<span class=\"tag\">188 m · 9 turns · indoor</span>\n<div class=\"in\"><h3 class=\"disp\" style=\"font-size: 32px; margin-bottom: 8px\">The track</h3><p style=\"margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Hairpins and gradients, barriers throughout. Fully indoor.</p><span class=\"pill\">See the track</span></div>\n</a>\n<a href=\"events.html\" class=\"pcard\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_5745.webp\" srcset=\"assets/photos/events-IMG_5745-480.webp 480w, assets/photos/events-IMG_5745-960.webp 960w, assets/photos/events-IMG_5745.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Private function room\">\n<span class=\"tag\">Party room · viewing deck</span>\n<div class=\"in\"><h3 class=\"disp\" style=\"font-size: 32px; margin-bottom: 8px\">Parties &amp; events</h3><p style=\"margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #C9C9C5\">Function room with track view plus an upstairs viewing deck.</p><span class=\"pill\">Event packages</span></div>\n</a>\n</div>\n</section>\n\n<!-- 02 Why choose -->\n<section style=\"background: #111113; border-top: 1px solid #222226; border-bottom: 1px solid #222226\">\n<div class=\"wrap row\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/voucher.webp\" srcset=\"assets/photos/voucher-480.webp 480w, assets/photos/voucher-960.webp 960w, assets/photos/voucher.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"OZ EKARTS venue at night\">\n<div>\n<p class=\"eyebrow\">02 — Why choose OZ EKARTS?</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 18px\">Built different,<br><span style=\"color: #5CE1E6\">on purpose.</span></h2>\n<div class=\"pb\"><span><b>High-torque electric karts</b>instant torque for speed and control — drift the corners and outpace your friends.</span></div>\n<div class=\"pb\"><span><b>Innovative track design</b>inspired by Mario Kart, with challenging turns and obstacles every lap.</span></div>\n<div class=\"pb\"><span><b>Eco-friendly</b>the venue runs entirely on renewable energy.</span></div>\n<div class=\"pb\"><span><b>Late-night racing</b>open till midnight Fridays and Saturdays.</span></div>\n<p class=\"body\" style=\"margin: 18px 0 0; font-size: 15px\">First time or seasoned racer, every session is built to keep you coming back.</p>\n</div>\n</div>\n</section>\n\n<!-- 03 Drift karts -->\n<section style=\"background: #F3F2EC; color: #0B0B0C\">\n<div class=\"wrap row\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<div>\n<p class=\"eyebrow\" style=\"color: #6D32D9\">03 — Our drift go karts</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 18px\">Drifting isn't<br>an option here —<br><span style=\"color: #6D32D9\">it's guaranteed.</span></h2>\n<div class=\"pb\" style=\"background: #fff; border-color: #0B0B0C; color: #0B0B0C\"><span><b style=\"color: #0B0B0C\">Instant torque</b>immediate acceleration for mastering tight turns.</span></div>\n<div class=\"pb\" style=\"background: #fff; border-color: #0B0B0C; color: #0B0B0C\"><span><b style=\"color: #0B0B0C\">Advanced differential technology</b>enhanced handling that makes every drift a breeze.</span></div>\n<div class=\"pb\" style=\"background: #fff; border-color: #0B0B0C; color: #0B0B0C\"><span><b style=\"color: #0B0B0C\">Zero emissions</b>fully electric, no fuel fumes, cleaner racing indoors.</span></div>\n<div class=\"pb\" style=\"background: #fff; border-color: #0B0B0C; color: #0B0B0C\"><span><b style=\"color: #0B0B0C\">Three speed settings</b>a safe, thrilling ride from beginners to seasoned racers.</span></div>\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts\" style=\"background: #0B0B0C; color: #F4F4F2; margin-top: 18px\">Book a session</a>\n</div>\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/adult-kart.webp\" srcset=\"assets/photos/adult-kart-480.webp 480w, assets/photos/adult-kart-960.webp 960w, assets/photos/adult-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Adult electric drift kart\" style=\"border: 2px solid #0B0B0C\">\n</div>\n</section>\n\n<!-- 04 Kids -->\n<section class=\"wrap row\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/events-IMG_0823.webp\" srcset=\"assets/photos/events-IMG_0823-480.webp 480w, assets/photos/events-IMG_0823-960.webp 960w, assets/photos/events-IMG_0823.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kids racing electric go karts at OZ EKARTS\">\n<div>\n<p class=\"eyebrow\">04 — Kids go karting</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 18px\">Their own kart<br><span style=\"color: #5CE1E6\">from age 6.</span></h2>\n<p class=\"body\" style=\"margin: 0 0 16px\">The only indoor track in Adelaide where children as young as 6 race their very own electric kart.</p>\n<div class=\"pb\"><span><b>Kid-friendly karts</b>young drivers build confidence in a safe, controlled session.</span></div>\n<div class=\"pb\"><span><b>Expert supervision</b>track marshals watch every race and adjust speed to each child's ability.</span></div>\n<div class=\"pb\"><span><b>Group fun</b>up to 9 children race together — birthdays, school holidays, family days.</span></div>\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/karting/11-under-junior-karts\" style=\"background: #F4F4F2; color: #0B0B0C; margin-top: 18px\">Book junior karts</a>\n</div>\n</section>\n\n<!-- 05 The track -->\n<section id=\"track\" style=\"background: #111113; border-top: 1px solid #222226; border-bottom: 1px solid #222226\">\n<div class=\"wrap\" style=\"padding-top: clamp(48px, 6.5vw, 96px); padding-bottom: clamp(48px, 6.5vw, 96px)\">\n<div class=\"row\" style=\"margin-bottom: 40px\">\n<div>\n<p class=\"eyebrow\">05 — The track</p>\n<h2 class=\"disp\" style=\"font-size: clamp(30px, 4.6vw, 64px); margin-bottom: 18px\">A circuit like<br><span style=\"color: #5CE1E6\">no other.</span></h2>\n<p class=\"body\" style=\"margin: 0 0 16px\">9 turns over 188 metres: sweeping curves, tight hairpins and changing gradients. The coated concrete surface gives less grip than bitumen, so every corner is a drift.</p>\n<div class=\"pb\"><span><b>Challenging 9-turn layout</b>turns and gradients that test your skills.</span></div>\n<div class=\"pb\"><span><b>Drift-style racing</b>high-torque motors plus low grip = slides every corner.</span></div>\n<div class=\"pb\"><span><b>Unique design</b>technical challenge and high-speed fun in one lap.</span></div>\n</div>\n<div style=\"border: 1px solid #26262A; background: #0B0B0C; line-height: 0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 2048 1516\" role=\"img\" aria-label=\"OZ EKARTS circuit map: 188 metres, 10 turns\">\n<defs>\n<radialGradient id=\"halo\"><stop offset=\"0\" stop-color=\"#2ECC71\" stop-opacity=\".95\"/><stop offset=\".45\" stop-color=\"#2ECC71\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#2ECC71\" stop-opacity=\"0\"/></radialGradient>\n<pattern id=\"plan\" width=\"80\" height=\"80\" patternUnits=\"userSpaceOnUse\"><path d=\"M80 0H0V80\" fill=\"none\" stroke=\"#17171A\" stroke-width=\"1\"/></pattern>\n<pattern id=\"chq\" width=\"12\" height=\"12\" patternUnits=\"userSpaceOnUse\"><rect width=\"6\" height=\"6\" fill=\"#F4F4F2\"/><rect x=\"6\" y=\"6\" width=\"6\" height=\"6\" fill=\"#F4F4F2\"/><rect x=\"6\" width=\"6\" height=\"6\" fill=\"#0B0B0C\"/><rect y=\"6\" width=\"6\" height=\"6\" fill=\"#0B0B0C\"/></pattern>\n</defs>\n<rect width=\"2048\" height=\"1516\" fill=\"#0B0B0C\"/><rect width=\"2048\" height=\"1516\" fill=\"url(#plan)\"/>\n<rect x=\"24\" y=\"60\" width=\"1480\" height=\"1420\" rx=\"40\" fill=\"#111113\" stroke=\"#26262A\" stroke-width=\"3\"/>\n<path d=\"M1428 564 Q1500 702 1593 702\" fill=     const data = {
      "Bookings": [
        ["Do you have a phone number?", "We operate online and don't offer phone support. Email info@ozekarts.com.au or message us on Instagram or Facebook. Book at bookings.racefacer.com/ozekarts. Walk-ins are welcome, but availability may be limited at busy times."],
        ["Do I need to book in advance?", "We strongly recommend booking online to guarantee your session time. Walk-ins are welcome when space is available, but it can't be guaranteed."],
        ["Can I book without paying?", "No. Full payment is required at the time of booking to secure your spot."],
        ["Large group \u2014 can we pay separately?", "Yes. Each person books the same session time online. For walk-ins, split payments can be processed in store."],
        ["Can I add drivers to my booking?", "Usually, yes \u2014 if the session still has space and stays within the 9-driver maximum. Contact us as early as possible."],
        ["Can I use more than one voucher online?", "The booking system accepts one voucher code per booking. For more than one, email or message us and we'll help."],
        ["Can Groupon vouchers be used online?", "No. Groupon doesn't integrate with our booking system, so Groupon bookings are redeemed in person, subject to availability: one voucher per person, one per day, Monday to Thursday only."],
        ["What if some drivers don't show up?", "No refunds for no-shows, but another person in your group may use the unused session."],
        ["Can I get a refund if I cancel?", "No refunds for cancellations. With at least 48 hours' notice we can reschedule, or try to resell your tickets \u2014 if resold you receive a voucher for that value, less a reselling fee. See the refund policy."],
        ["Can I book several races in one visit?", "Yes. Many people do, and discounted extra sessions may be available depending on availability."]
      ],
      "Race info": [
        ["How fast do the karts go?", "Adult karts up to 35 km/h; junior karts up to 15 km/h."],
        ["How long is a session?", "Adult sessions are 10 minutes, junior sessions 7 minutes."],
        ["How many people race at once?", "The track comfortably fits 7 racers, with a maximum of 9. Larger groups: email events@ozekarts.com.au or message us and we'll organise your races."],
        ["Can I race against my friends?", "Yes. Book the same session time and you'll generally race together, subject to capacity and driver categories."],
        ["Are lap times recorded?", "Yes, every session \u2014 compare with friends and track your progress."],
        ["Can I drift?", "Yes. The indoor track and electric karts are designed for controlled drifting, for beginners and experienced drivers alike."],
        ["Why electric karts?", "Instant acceleration and torque, smooth responsive handling, less noise and zero emissions."],
        ["How long is the track?", "188 metres of low-grip coated concrete with 9 turns, hairpins and a gradient section."],
        ["How many laps will I get?", "Depending on pace, adults average 16\u201320 laps and juniors 7\u201310."]
      ],
      "Age, height & safety": [
        ["Age, height and weight requirements?", "Adult karts: ages 12+, minimum height 140 cm, maximum weight 130 kg. Junior karts: ages 6\u201311 (recommended 6\u20139), minimum height 100 cm, maximum weight 55 kg."],
        ["Is it safe for beginners?", "Yes. Every session starts with a safety briefing and our team monitors every race."],
        ["Do I need experience?", "No. Sessions suit first-timers and experienced racers alike."],
        ["Are karts speed-limited for younger drivers?", "Track marshals assess each driver on track and adjust kart speed to suit."],
        ["Can adults and juniors race together?", "No. For safety, adult and junior sessions run separately."],
        ["Is bumping allowed?", "No. Deliberate bumping or reckless driving ends your session without refund."],
        ["Can I race while pregnant?", "Go-karting isn't recommended during pregnancy."],
        ["What is the alcohol policy?", "A strict 0.00 BAC applies at all times. Anyone suspected of being under the influence of alcohol or drugs won't race. No alcohol or smoking near the track."]
      ],
      "What to bring": [
        ["What should I bring and wear?", "Enclosed shoes, a hair tie for hair past the shoulders, and a drink bottle on hot days. A balaclava is required with hire helmets ($5 in store or bring your own). No loose clothing."],
        ["Can I bring my own helmet?", "Yes \u2014 full-face and compliant with Australian Standard AS1698."],
        ["Skirts, dresses or loose clothing?", "Wear comfortable clothing and enclosed shoes. Loose clothing, scarves and long dresses can't be worn while racing."],
        ["Can I use my phone on track?", "No. Phones and loose items aren't permitted on track."],
        ["Are hire helmets cleaned?", "Yes, all hire helmets are cleaned and sanitised regularly."]
      ],
      "Venue": [
        ["Is the track indoors?", "Yes, fully indoor \u2014 racing continues in all weather, including rain and extreme heat."],
        ["Is the venue air-conditioned?", "Reception is air-conditioned and the track area has large evaporative cooling fans."],
        ["Food and drinks?", "Yes, drinks and snacks are available at the venue."],
        ["Is there parking?", "Yes, free on-site parking."],
        ["Can spectators watch?", "Yes, from the viewing deck areas."],
        ["When is it busiest?", "Weekends (especially 12\u20132 pm) and school or public holidays; walk-in waits can exceed 2 hours. Quieter: weekdays and evenings around 5:30\u20136:30 pm. Book ahead at busy times."],
        ["Do you have tandem karts?", "No. Juniors aged 6\u201311 drive their own kart."]

      "Parties, events & groups": [
        ["What party packages do you offer?", "Junior party packages for ages 6\u201311 and race packages for ages 12+. See Events & packages."],
        ["Do you host parties or corporate events?", "Yes \u2014 birthdays, corporate events, team building and group functions, using the party room and upstairs viewing deck. Enquire via the events form."],
        ["Good for team building?", "Absolutely. Friendly competition in a fun, high-energy setting."],
        ["Can I hire the whole venue?", "Exclusive venue hire may be available for corporate events, parties, schools and large groups. Contact our events team."],
        ["How early should I arrive?", "At least 30 minutes before your session for check-in, safety briefing and helmet fitting."],
        ["What if I arrive late?", "You may miss your session, and rescheduling can't be guaranteed when the venue is fully booked."]
      ],
      "Gift vouchers": [
        ["Do you sell gift vouchers?", "Yes \u2014 single, double or triple sessions, or a custom amount. One voucher per booking."]
      ]
    };
    const names = Object.keys(data);
    const topic = this.state.topic;
    const topics = names.map((name) => ({
      name,
      pick: () => this.setState({ topic: name, open: {} }),
      style: (name === topic ? 'background: #0B0B0C; color: #5CE1E6; border: 2px solid #0B0B0C;' : 'background: transparent; color: #0B0B0C; border: 2px solid #0B0B0C;') + ' min-height: 40px; padding: 0 14px; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer'
    }));
    const faqs = data[topic].map(([q, a], i) => {
      const open = !!this.state.open[i];
      return { q, a, open, icon: open ? '−' : '+', toggle: () => this.setState({ open: { ...this.state.open, [i]: !open } }) };
    });
    return { topics, faqs };
  }
}

  })()
});

return class Component extends DCLogic {
  constructor(p) { super(p); this.state = { city: 'adl', chat: false }; }
  componentDidMount() {
    try { const c = window.localStorage.getItem('oze-city'); if (c === 'mel' || c === 'adl') this.setState({ city: c }); } catch (e) {}
    // The info bar is fixed to the top of the viewport; keep a spacer the same height so nothing hides under it.
    try {
      const root = this.__host.body, bar = root.querySelector('.infobar'), sp = root.querySelector('.infobar-spacer');
      const fit = () => { sp.style.height = bar.offsetHeight + 'px'; };
      fit(); new ResizeObserver(fit).observe(bar);
    } catch (e) {}
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    // overlay="true" (home): header floats over the hero video with a transparent, fading background.
    const overlay = String(this.props.overlay) === 'true';
    const city = this.state.city;
    const pick = (c) => () => { try { window.localStorage.setItem('oze-city', c); } catch (e) {} this.setState({ city: c }); };
    const on = 'background: #0B0B0C; color: #F4F4F2', off = 'background: transparent; color: #0B0B0C';
    // Drop-down menus (owner's brief): show the options under Events / Specials / Pricing without leaving the page.
    const sub = {
      karting: [['Racing', 'racing.html'], ['Drift karting', 'racing.html#drift'], ['Pricing', 'index.html#prices']],
      vision: [['Our story', 'our-vision.html'], ['Gallery', 'our-vision.html#gallery'], ['FAQ', 'faq.html']],
      events: [['Junior parties', 'events.html#packages'], ['Grand Prix & Rapid Racing', 'events.html#racing'], ['Venue hire', 'events.html#venue-hire'], ['Make an enquiry', 'events.html#enquiry']],
      specials: [['Monday · Drifting Madness', 'specials.html#mon'], ['Wicked Wednesday', 'specials.html#wed'], ['Thursday Neon Nights', 'specials.html#thu'], ['Fri & Sat · Late night karting', 'specials.html#late']]
    };
    const nav = [
      ['home', 'Home', 'index.html'], ['karting', 'Karting', 'racing.html'], ['events', 'Events & Parties', 'events.html'],
      ['specials', 'Specials', 'specials.html'], ['vision', 'Our Vision', 'our-vision.html'], ['contact', 'Contact', 'contact.html']
    ];
    const act = { racing: 'karting', faq: 'vision' }[active] || active;
    const d = new Date().getDay();
    const oz = window.OZE ? window.OZE.today() : null;
    const hrs = oz ? (oz.closed ? 'Closed today (' + oz.day + ')' : oz.hours) : ['10:00am – 9:00pm', '12:00pm – 9:00pm', 'Closed today (Tuesday)', '12:00pm – 9:00pm', '12:00pm – 10:00pm', '10:00am – 12:00am', '9:00am – 12:00am'][d];
    const closedToday = oz ? oz.closed : d === 2;
    const holiday = !!(oz && oz.holiday);
    const specials = {
      1: ['Drifting Madness · buy 2 get 1 free from 4pm', 'specials.html#mon'],
      3: ['Wicked Wednesday · $25 adult sessions', 'specials.html#wed'],
      4: ['Neon Nights · rainbow LEDs from sunset', 'specials.html#thu'],
      5: ['Late night karting · open till midnight', 'specials.html#late'],
      6: ['Late night karting · open till midnight', 'specials.html#late']
    };
    const sp = specials[d];
    return {
      chatOpen: this.state.chat, chatCls: 'chaty' + (this.state.chat ? ' open' : ''), toggleChat: () => this.setState({ chat: !this.state.chat }),
      rootStyle: 'width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: ' + (overlay ? 'transparent' : '#0B0B0C'),
      barStyle: overlay ? 'background: linear-gradient(180deg, rgba(11,11,12,.78) 0%, rgba(11,11,12,.45) 60%, rgba(11,11,12,0) 100%)' : 'border-bottom: 1px solid #222226',
      cityName: city === 'mel' ? 'Melbourne' : 'Adelaide',
      todayLine: city === 'mel' ? 'Melbourne hours on ozekartsvic.com.au' : (closedToday ? hrs : 'Open today ' + hrs) + (holiday ? ' · School holidays' : ''),
      hasSpecial: city === 'adl' && !!sp, special: sp ? sp[0] : '', specialHref: sp ? sp[1] : '#',
      bookHref: city === 'mel' ? 'https://ozekartsvic.com.au' : 'https://bookings.racefacer.com/ozekarts',
      voucherHref: city === 'mel' ? 'https://ozekartsvic.com.au' : 'https://vouchers.racefacer.com/ozekarts',
      pickAdl: pick('adl'), pickMel: pick('mel'), adlStyle: city === 'adl' ? on : off, melStyle: city === 'mel' ? on : off,
      items: nav.map(([id, label, href]) => ({
        label, href, sub: sub[id] ? sub[id].map(([label, href]) => ({ label, href })) : null,
        style: id === act ? 'color: #5CE1E6; text-decoration: none; padding: 10px 0; border-bottom: 2px solid #5CE1E6' : 'color: #F4F4F2; text-decoration: none; padding: 10px 0; border-bottom: 2px solid transparent'
      }))
    };
  }
}

  css: "body{margin:0;background:#0B0B0C}\nimg{max-width:100%}\n@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}\na{color:#5CE1E6}a:hover{color:#FFFFFF}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5CE1E6}\n.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}",
  defaults: {},
  logic: (function () {

return class Component extends DCLogic {
  renderVals() {
    const wk = window.OZE ? window.OZE.week() : null;
    const base = wk ? wk.rows.map((r) => [r.d, r.t]) : [['Monday', '12:00pm – 9:00pm'], ['Tuesday', 'Closed'], ['Wednesday', '12:00pm – 9:00pm'], ['Thursday', '12:00pm – 10:00pm'], ['Friday', '10:00am – 12:00am'], ['Saturday', '9:00am – 12:00am'], ['Sunday', '10:00am – 9:00pm']];
    const holiday = !!(wk && wk.holiday);
    const hours = base.map(([d, t]) => ({ d, t, style: t === 'Closed' ? 'color: #8C52FF' : (holiday && d === 'Tuesday' ? 'color: #5CE1E6' : 'color: #F4F4F2') }));
    return { hours, holiday,
      holidayNote: holiday ? 'School holidays — open 7 days' : 'Open 7 days during school holidays',
      noteStyle: holiday ? 'margin: 10px 0 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #5CE1E6' : 'margin: 10px 0 0; font-size: 12px; color: #A1A1A6' };
  }
}

  })()
});
DC.mount(document.querySelector('dc-root'), "Vision", {});
