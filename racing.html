img{max-width:100%}
@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}
a{color:#39FF14}a:hover{color:#FFFFFF}
section[style*="#F3F2EC"] a:not(.btn):not(.pill),section[style*="#F3F2EC"] a:not(.btn):not(.pill):hover{color:#0B0B0C}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}
.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#D2A10D}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.body{font-size:16px;line-height:1.6;color:#C9C9C5}
.card{background:#151517;border:1px solid #26262A}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center}
.row img{width:100%;height:460px;object-fit:cover;display:block}
.pb{display:flex;align-items:center;gap:12px;background:#151517;border:1px solid #26262A;padding:13px 16px;font-size:14px;margin-bottom:8px}
.pb::before{content:"";width:8px;height:8px;border-radius:50%;background:#FF00A1;flex:none}
.stepc{text-align:center;padding:8px}
.stepc .c{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;border:2px solid #39FF14;display:flex;align-items:center;justify-content:center;font:italic 400 30px/1 Dameron,sans-serif;color:#39FF14}
.stepc b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stepc span{font-size:13px;line-height:1.5;color:#A1A1A6}
.step{padding:24px;display:flex;flex-direction:column;gap:8px}
.step .n{font:italic 400 48px/1 Dameron,sans-serif;color:#FF00A1}
</style>

    const holiday = !!(wk && wk.holiday);
    const hours = base.map(([d, t]) => ({ d, t, style: t === 'Closed' ? 'color: #8C52FF' : (holiday && d === 'Tuesday' ? 'color: #39FF14' : 'color: #F4F4F2') }));
    return { hours, holiday,
      holidayNote: holiday ? 'School holidays · open 7 days' : 'Open 7 days during school holidays',
      noteStyle: holiday ? 'margin: 10px 0 0; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #39FF14' : 'margin: 10px 0 0; font-size: 12px; color: #A1A1A6' };
  }
}

  })()
});
DC.mount(document.querySelector('dc-root'), "Racing", {});
</script>
