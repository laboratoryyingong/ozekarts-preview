DC.define("Specials", {
  template: "<div style=\"width: 100%; font-family: Aldrich, sans-serif; color: #F4F4F2; background: #0B0B0C\">\n\n<dc-import name=\"Header\" active=\"specials\"></dc-import>\n\n<section class=\"wrap\" style=\"padding-top: clamp(40px, 5vw, 72px); padding-bottom: clamp(40px, 5vw, 72px)\">\n<span style=\"display: inline-block; background: #8C52FF; color: #fff; font: 700 12px/1 Aldrich, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px; margin-bottom: 22px\">Go karting specials</span>\n<h1 class=\"disp\" style=\"font-size: clamp(34px, 3.7vw, 56px); max-width: 520px\">Unbeatable deals.<br><span style=\"color: #5CE1E6\">Every week.</span></h1>\n<p class=\"body\" style=\"max-width: 440px; margin: 18px 0 28px; font-size: 16px; color: #F4F4F2\">Weekly deals, leaderboard challenges and giveaways. Offers change — follow us on social.</p>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px\">\n<sc-for list=\"{{blocks}}\" as=\"b\">\n<a href=\"{{b.href}}\" style=\"{{b.style}}\">\n<sc-if value=\"{{b.today}}\"><span style=\"position: absolute; top: 14px; right: 14px; background: #0B0B0C; color: #F4F4F2; font: 700 10px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px\">Today</span></sc-if>\n<span class=\"disp\" style=\"font-size: clamp(34px, 3.4vw, 48px); display: block\">{{b.day}}</span>\n<span style=\"display: block; margin-top: auto; font: 700 12px/1.4 Aldrich, sans-serif; letter-spacing: .08em; text-transform: uppercase\">{{b.line}}</span>\n</a>\n</sc-for>\n</div>\n</section>\n\n<section class=\"wrap\" style=\"padding-top: 80px; padding-bottom: 96px; display: flex; flex-direction: column; gap: 24px\">\n\n<article id=\"mon\" class=\"card sp\" style=\"{{t_mon}}\">\n<sc-if value=\"{{is_mon}}\"><span style=\"position: absolute; top: 16px; left: 16px; z-index: 1; background: #5CE1E6; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Today</span></sc-if>\n<div class=\"tx\">\n<p class=\"eyebrow\">01 — Every Monday · 4:00 pm till close</p>\n<h2 class=\"disp\" style=\"font-size: clamp(28px, 4.3vw, 60px)\">Monday night<br>drifting madness</h2>\n<p class=\"disp\" style=\"font-size: 28px; color: #5CE1E6\">Buy 2 sessions, get 1 absolutely free</p>\n<p class=\"body\" style=\"margin: 0\">Three sessions for the price of two, every lap timed. Adult and junior karts. Limited spots; excludes school and public holidays.</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px\">\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/monthly-special/\" style=\"background: #F4F4F2; color: #0B0B0C\">Adult karts</a>\n<a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/monthly-special/11-under-junior-karts-1\" style=\"background: transparent; color: #F4F4F2; border: 1px solid #F4F4F2; clip-path: none\">Junior karts</a>\n</div>\n</div>\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/photos/drifting-IMG_3999.webp\" srcset=\"assets/photos/drifting-IMG_3999-480.webp 480w, assets/photos/drifting-IMG_3999-960.webp 960w, assets/photos/drifting-IMG_3999.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Kart drifting through neon light trails\" style=\"width: 100%; height: 100%; min-height: 380px; object-fit: cover\">\n</article>\n\n<article id=\"wed\" class=\"card sp\" style=\"{{t_wed}}\">\n<sc-if value=\"{{is_wed}}\"><span style=\"position: absolute; top: 16px; left: 16px; z-index: 1; background: #5CE1E6; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Today</span></sc-if>\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/adult-kart.webp\" srcset=\"assets/photos/adult-kart-480.webp 480w, assets/photos/adult-kart-960.webp 960w, assets/photos/adult-kart.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Adult kart at speed\" style=\"width: 100%; height: 100%; min-height: 380px; object-fit: cover\">\n<div class=\"tx\">\n<p class=\"eyebrow\">02 — Every Wednesday</p>\n<h2 class=\"disp\" style=\"font-size: clamp(28px, 4.3vw, 60px)\">Wicked<br>Wednesday</h2>\n<div style=\"display: flex; align-items: baseline; gap: 12px\"><span class=\"disp\" style=\"font-size: clamp(30px, 5.1vw, 72px); font-style: normal; color: #5CE1E6\">$25</span><span style=\"font-size: 15px; color: #C9C9C5\">adult session · save $14</span></div>\n<p class=\"body\" style=\"margin: 0\">10-minute races. Walk-ins welcome; book online to secure a spot.</p>\n<div style=\"margin-top: 6px\"><a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/wicked-wed-1\" style=\"background: #F4F4F2; color: #0B0B0C\">Book Wicked Wednesday</a></div>\n</div>\n</article>\n\n<article id=\"thu\" class=\"card sp\" style=\"{{t_thu}}\">\n<sc-if value=\"{{is_thu}}\"><span style=\"position: absolute; top: 16px; left: 16px; z-index: 1; background: #5CE1E6; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Today</span></sc-if>\n<div class=\"tx\">\n<p class=\"eyebrow\">03 — Every Thursday · sunset till 9 pm, year round</p>\n<h2 class=\"disp\" style=\"font-size: clamp(28px, 4.3vw, 60px)\">Thursday<br>Neon Nights</h2>\n<p class=\"body\" style=\"margin: 0\">The whole track lit in rainbow LEDs. 10-minute sessions under the neon.</p>\n<div style=\"margin-top: 6px\"><a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/karting/12-years\" style=\"background: #F4F4F2; color: #0B0B0C\">Book Neon Nights</a></div>\n</div>\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/header-IMG_2111.webp\" srcset=\"assets/photos/header-IMG_2111-480.webp 480w, assets/photos/header-IMG_2111-960.webp 960w, assets/photos/header-IMG_2111.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Neon-lit track with the Oz-E Karts mural\" style=\"width: 100%; height: 100%; min-height: 380px; object-fit: cover\">\n</article>\n\n<article id=\"late\" class=\"card sp\" style=\"{{t_late}}\">\n<sc-if value=\"{{is_late}}\"><span style=\"position: absolute; top: 16px; left: 16px; z-index: 1; background: #5CE1E6; color: #0B0B0C; font: 700 11px/1 Aldrich, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 10px\">Today</span></sc-if>\n<img decoding=\"async\" loading=\"lazy\" src=\"assets/photos/racing-IMG_3876.webp\" srcset=\"assets/photos/racing-IMG_3876-480.webp 480w, assets/photos/racing-IMG_3876-960.webp 960w, assets/photos/racing-IMG_3876.webp 1800w\" sizes=\"(max-width: 700px) 100vw, (max-width: 1100px) 50vw, 620px\" alt=\"Karts racing side by side\" style=\"width: 100%; height: 100%; min-height: 380px; object-fit: cover\">\n<div class=\"tx\">\n<p class=\"eyebrow\">04 — Every Friday &amp; Saturday · till midnight</p>\n<h2 class=\"disp\" style=\"font-size: clamp(28px, 4.3vw, 60px)\">Late night<br>karting</h2>\n<p class=\"body\" style=\"margin: 0\">Open till midnight, up to 7 on track. Walk-ins welcome, booking recommended. 0% alcohol.</p>\n<div style=\"margin-top: 6px\"><a class=\"btn\" href=\"https://bookings.racefacer.com/ozekarts/karting/12-years\" style=\"background: #F4F4F2; color: #0B0B0C\">Book a late session</a></div>\n</div>\n</article>\n\n</section>\n\n<dc-import name=\"Footer\"></dc-import>\n\n</div>",
  css: "body{margin:0;background:#0B0B0C}\nimg{max-width:100%}\n@media (max-width:700px){.wrap{padding-left:16px!important;padding-right:16px!important}}\na{color:#5CE1E6}a:hover{color:#FFFFFF}\n.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}\n.disp{margin:0;font:italic 400 1em/1.02 Dameron,Aldrich,sans-serif;text-transform:uppercase}\n.eyebrow{margin:0 0 14px;font:700 12px/1 Aldrich,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5CE1E6}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;font:700 13px/1 Aldrich,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}\n.body{font-size:16px;line-height:1.6;color:#C9C9C5}\n.card{background:#151517;border:1px solid #26262A}\n.sp{position:relative;display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));overflow:hidden}\n.sp .tx{padding:44px;display:flex;flex-direction:column;gap:14px;justify-content:center}",
  defaults: {},
  logic: (function () {

return class Component extends DCLogic {
  renderVals() {
    const d = new Date().getDay();
    const on = 'outline: 1px solid #5CE1E6', off = '';
    const blk = [['Mon', 'Buy 2 get 1 free', '#mon', '#8C52FF', '#FFFFFF', 1], ['Wed', '$25 adult sessions', '#wed', '#8C52FF', '#FFFFFF', 3], ['Thu', 'Neon Nights', '#thu', '#8C52FF', '#FFFFFF', 4], ['Fri + Sat', 'Open till midnight', '#late', '#8C52FF', '#FFFFFF', 5]];
    const blocks = blk.map(([day, line, href, bg, fg, dd]) => ({ day, line, href, today: dd === d || (dd === 5 && d === 6), style: 'position: relative; display: flex; flex-direction: column; min-height: 160px; padding: 20px; background: ' + bg + '; color: ' + fg + '; text-decoration: none' }));
    return {
      blocks,
      is_mon: d === 1, is_wed: d === 3, is_thu: d === 4, is_late: d === 5 || d === 6,
      t_mon: d === 1 ? on : off, t_wed: d === 3 ? on : off, t_thu: d === 4 ? on : off, t_late: (d === 5 || d === 6) ? on : off
    };
  }
}

  })()
});
DC.define("Header", {
  template: "<header style=\"{{rootStyle}}\">\n<div class=\"infobar\" style=\"background: #F4F4F2; color: #0B0B0C; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 8px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px\">\n<span style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px\">\n<span>{{todayLine}}</span>\n<sc-if value=\"{{hasSpecial}}\"><a href=\"{{specialHref}}\" style=\"color: #0B0B0C; text-decoration: none; background: #5CE1E6; padding: 5px 9px\">Tonight: {{special}} →</a></sc-if>\n</span>\n<span style=\"display: flex; gap: 18px; align-items: center\">\n<span class=\"hidesm\" style=\"display: flex; gap: 18px; align-items: center\"><a href=\"mailto:info@ozekarts.com.au\" style=\"color: #0B0B0C; text-decoration: none\">info@ozekarts.com.au</a><a href=\"https://m.me/OZEKARTSSA/\" style=\"color: #0B0B0C; text-decoration: none\">Live chat</a></span>\n<div role=\"group\" aria-label=\"Booking location\" style=\"display: flex; border: 1px solid #0B0B0C\">\n<button type=\"button\" class=\"seg\" data-on-click=\"{{pickAdl}}\" style=\"{{adlStyle}}\">Adelaide</button>\n<button type=\"button\" class=\"seg\" data-on-click=\"{{pickMel}}\" style=\"{{melStyle}}\">Melbourne</button>\n</div>\n</span>\n</div>\n</div>\n<div class=\"infobar-spacer\" aria-hidden=\"true\" style=\"height: 40px\"></div>\n<div style=\"{{barStyle}}\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 12px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px\">\n<a href=\"index.html\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F4F4F2\">\n<img decoding=\"async\" fetchpriority=\"high\" src=\"assets/logo/oze-logo-white.webp\" alt=\"OZ EKARTS logo\" style=\"width: 56px; height: 56px; object-fit: contain\">\n<span style=\"font: 700 italic clamp(28px, 2.8vw, 40px)/1 Aldrich, sans-serif; letter-spacing: -.02em; text-transform: uppercase\">OZ <span style=\"color: #5CE1E6\">EKARTS</span></span>\n</a>\n<nav aria-label=\"Main\" class=\"navmain\" style=\"display: flex; flex-wrap: wrap; gap: 22px; font: 700 14px/1 Aldrich, sans-serif; letter-spacing: .02em; text-transform: uppercase\">\n<sc-for list=\"{{items}}\" as=\"item\">\n<span class=\"navitem\"><a href=\"{{item.href}}\" style=\"{{item.style}}\">{{item.label}}<sc-if value=\"{{item.sub}}\"><span aria-hidden=\"true\" style=\"font-size: 9px; margin-left: 6px; opacity: .7\">▼</span></sc-if></a>\n<sc-if value=\"{{item.sub}}\"><span class=\"sub\"><sc-for list=\"{{item.sub}}\" as=\"s\"><a href=\"{{s.href}}\">{{s.label}}</a></sc-for></span></sc-if></span>\n</sc-for>\n</nav>\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<a class=\"btn\" href=\"{{bookHref}}\" style=\"background: #F4F4F2; color: #0B0B0C\">Book now</a>\n<button type=\"button\" class=\"burger\" aria-label=\"Open menu\" style=\"display: none; width: 44px; height: 44px; background: #151517; border: 1px solid #333338; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer\"><span style=\"display: block; width: 20px; height: 2px; background: #F4F4F2\"></span><span style=\"display: block; width: 20px; height: 2px; background: #F4F4F2\"></span><span style=\"display: block; width: 20px; height: 2px; background: #F4F4F2\"></span></button>\n</div>\n</div>\n</div>\n</header>\n<div class=\"{{chatCls}}\">\n<button type=\"button\" class=\"cb launcher\" aria-label=\"Quick contact\" data-on-click=\"{{toggleChat}}\">\n<svg class=\"ico-chat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3C6.5 3 2 6.9 2 11.6c0 2.6 1.4 5 3.6 6.6L4.8 21l3.9-1.9c1 .3 2.1.4 3.3.4 5.5 0 10-3.9 10-8.6S17.5 3 12 3z\"/></svg>\n<svg class=\"ico-x\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6.2 4.8L12 10.6l5.8-5.8 1.4 1.4L13.4 12l5.8 5.8-1.4 1.4L12 13.4l-5.8 5.8-1.4-1.4L10.6 12 4.8 6.2z\"/></svg>\n</button>\n<div class=\"items\">\n<a class=\"cb\" style=\"background: #0084FF\" href=\"https://m.me/OZEKARTSSA/\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2C6.5 2 2 6.1 2 11.3c0 2.9 1.4 5.5 3.7 7.2V22l3.4-1.9c.9.3 1.9.4 2.9.4 5.5 0 10-4.1 10-9.3S17.5 2 12 2zm1 12.5l-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.4 5.8z\"/></svg><span class=\"lbl\">Chat with us</span></a>\n<a class=\"cb\" style=\"background: #34A853\" href=\"https://maps.app.goo.gl/AcX8JzWEnNGbV8CU8\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z\"/></svg><span class=\"lbl\">Our location</span></a>\n<a class=\"cb\" style=\"background: #000\" href=\"https://www.tiktok.com/@ozekartssa\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M16.5 3c.3 2.3 1.7 3.8 4 4v3c-1.5 0-2.9-.5-4-1.3V15a5.5 5.5 0 1 1-5.5-5.5c.3 0 .7 0 1 .1v3.1a2.5 2.5 0 1 0 1.5 2.3V3h3z\"/></svg><span class=\"lbl\">TikTok</span></a>\n<a class=\"cb ig\" href=\"https://www.instagram.com/ozekartssa/\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm4.8-3.3a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z\"/></svg><span class=\"lbl\">Instagram</span></a>\n<a class=\"cb\" style=\"background: #8C52FF\" href=\"{{bookHref}}\"><svg class=\"stroke\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4\"/></svg><span class=\"lbl\">Booking page</span></a>\n</div>\n</div>\n<nav class=\"rail\" aria-label=\"Quick actions\">\n<a class=\"rail-btn primary\" href=\"{{bookHref}}\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\
